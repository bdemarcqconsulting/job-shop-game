// ── GAME ENGINE ───────────────────────────────────────────────
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

function mkDeck(){
  return shuffle([1,2,3,4].flatMap(p=>Array.from({length:9},(_,i)=>({
    id:`P${p}-${i+1}`, product:p, copy:i+1, routing:[...ROUTINGS[p]],
    ops:ROUTINGS[p].map(wc=>({wc,dayComplete:null,done:false})),
    currentOpIdx:-1, releaseDay:null, completedDay:null, flowDays:null,
  }))));
}

function mkTeam(id,name){
  return{id,name,players:{},deck:mkDeck(),queues:{A:[],B:[],C:[],D:[]},completed:[],bufferB:0};
}

function calcBuf(team){
  return WCS.reduce((sum,wc)=>sum+(team.queues[wc]||[]).reduce((n,card)=>{
    let b=0; for(let i=card.currentOpIdx;i<card.routing.length;i++) if(card.routing[i]==="B") b++; return n+b;
  },0),0);
}

function applyDay(team, day, scenario, actions){
  const t = JSON.parse(JSON.stringify(team));
  const bufBefore = calcBuf(t);

  // Process WC stations
  WCS.forEach(wc => {
    const role = `wc-${wc.toLowerCase()}`;
    const act = actions[role]; // cardId | 'pass' | undefined
    if (t.queues[wc].length === 0 || act === 'pass') return;

    let cardToProcess = null;
    if (act && act !== 'pass' && act !== 'process') {
      // Player chose a specific card (S2/S3 or manual)
      const idx = t.queues[wc].findIndex(c => c.id === act);
      if (idx >= 0) [cardToProcess] = t.queues[wc].splice(idx, 1);
    }
    // Default / S1 FIFO / auto-pilot: take first card
    if (!cardToProcess && t.queues[wc].length > 0) {
      cardToProcess = t.queues[wc].shift();
    }

    if (cardToProcess) {
      cardToProcess.ops[cardToProcess.currentOpIdx].dayComplete = day;
      cardToProcess.ops[cardToProcess.currentOpIdx].done = true;
      cardToProcess.currentOpIdx++;
      if (cardToProcess.currentOpIdx >= cardToProcess.routing.length) {
        cardToProcess.completedDay = day;
        cardToProcess.flowDays = day - cardToProcess.releaseDay;
        t.completed.push(cardToProcess);
      } else {
        t.queues[cardToProcess.routing[cardToProcess.currentOpIdx]].push(cardToProcess);
      }
    }
  });

  // Scheduler release
  const sa = actions['scheduler'];
  if (t.deck.length > 0) {
    let toRelease = null;
    if (scenario === 1) {
      if (sa !== 'hold') toRelease = t.deck.shift();
    } else if (scenario === 2) {
      if (sa && sa.startsWith('release:')) {
        const idx = t.deck.findIndex(c => c.id === sa.slice(8));
        if (idx >= 0) [toRelease] = t.deck.splice(idx, 1);
      } else if (sa !== 'hold') {
        toRelease = t.deck.shift();
      }
    } else if (scenario === 3 && sa !== 'hold' && bufBefore < BUFFER_LIMIT) {
      if (sa && sa.startsWith('release:')) {
        const idx = t.deck.findIndex(c => c.id === sa.slice(8));
        if (idx >= 0) [toRelease] = t.deck.splice(idx, 1);
      } else {
        toRelease = t.deck.shift();
      }
    }
    if (toRelease) {
      toRelease.releaseDay = day;
      toRelease.currentOpIdx = 0;
      t.queues[toRelease.routing[0]].push(toRelease);
    }
  }
  t.bufferB = calcBuf(t);
  return t;
}

function computeStats(cards){
  const f=cards.map(c=>c.flowDays).filter(v=>v!=null).sort((a,b)=>a-b);
  if(!f.length)return null;
  const avg=f.reduce((a,b)=>a+b,0)/f.length;
  const med=f.length%2===0?(f[f.length/2-1]+f[f.length/2])/2:f[Math.floor(f.length/2)];
  return{min:f[0],max:f[f.length-1],avg:+(avg.toFixed(1)),stddev:+(Math.sqrt(f.reduce((a,v)=>a+Math.pow(v-avg,2),0)/f.length).toFixed(1)),median:med,count:f.length};
}

function genCode(){const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";return Array.from({length:6},()=>c[0|Math.random()*c.length]).join("");}
function isAuto(team,role){return AUTO_ORDER.includes(role)&&!team.players[role];}
function getHumanRoles(team){return ROLES.filter(r=>r!=="monitor"&&!isAuto(team,r));}

async function saveSession(code,state){await db.ref(`sessions/jsg-${code}`).set({json:JSON.stringify(state)});}
async function loadSession(code){const snap=await db.ref(`sessions/jsg-${code}`).get();if(!snap.exists())return null;return JSON.parse(snap.val().json);}
async function saveAction(code,team,role,day,action){await db.ref(`actions/jsg-${code}-${team}-${role}-${day}`).set({json:JSON.stringify({action,ts:Date.now()})});}
async function loadAllActions(code,teamId,day){const acts={};for(const role of ROLES){const snap=await db.ref(`actions/jsg-${code}-${teamId}-${role}-${day}`).get();if(snap.exists())acts[role]=JSON.parse(snap.val().json).action;}return acts;}

function SchedulerView({session,team,t,onUpdate}){
  const [selectedCard,setSelectedCard]=useState(null);
  const [submitted,setSubmitted]=useState(false);
  const [myAct,setMyAct]=useState(null);
  const [dragOver,setDragOver]=useState(false);

  useEffect(()=>{setSubmitted(false);setMyAct(null);setSelectedCard(null);},[session.day,session.dayPhase]);
  useEffect(()=>{
    const iv=setInterval(async()=>{const ns=await loadSession(session.code);if(ns&&(ns.day!==session.day||ns.dayPhase!==session.dayPhase))onUpdate(ns);},2500);
    return()=>clearInterval(iv);
  },[session.code,session.day,session.dayPhase]);

  const submit=async(action)=>{setMyAct(action);setSubmitted(true);await saveAction(session.code,team.id,"scheduler",session.day,action);};
  const isDayOpen=session.dayPhase==="open";
  const buf=team.bufferB||0;
  const s3Blocked=session.scenario===3&&buf>=BUFFER_LIMIT;

  const handleDragStart=(e,cardId)=>{e.dataTransfer.setData("cardId",cardId);};
  const handleDrop=async(e)=>{
    e.preventDefault();setDragOver(false);
    if(submitted||!isDayOpen) return;
    const cardId=e.dataTransfer.getData("cardId");
    if(!cardId) return;
    if(s3Blocked){alert(t.bufFull);return;}
    await submit(session.scenario===1?'release':`release:${cardId}`);
  };

  return(<div style={{padding:16}}>
    <TeamMini team={team} t={t}/>
    {session.scenario===3&&(
      <div style={{margin:"8px 0",padding:"6px 12px",borderRadius:6,background:buf>=BUFFER_LIMIT?"#FEE2E2":"#DCFCE7",color:buf>=BUFFER_LIMIT?"#D4500A":"#2D7D52",fontWeight:600,fontSize:12}}>
        {buf>=BUFFER_LIMIT?`🔴 ${t.bufFull}`:`🟢 ${t.bufOk}`}
      </div>
    )}
    <div style={{...G.card,marginTop:8}}>
      <div style={{fontWeight:700,fontSize:13,color:"#1B3A4B",marginBottom:10}}>
        {t.schedulerDeck} — {team.deck.length} {t.cardsLeft}
      </div>
      {/* Deck queue - all cards visible */}
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:16,maxHeight:360,overflowY:"auto"}}>
        {team.deck.length===0
          ?<div style={{color:"#94A3B8",fontSize:13,padding:12}}>{t.deckEmpty}</div>
          :team.deck.map((card,i)=>(
            <div key={card.id} draggable={isDayOpen&&!submitted&&!s3Blocked} onDragStart={e=>handleDragStart(e,card.id)}>
              <OrderCard card={card}
                selected={selectedCard===card.id}
                selectable={isDayOpen&&!submitted&&session.scenario!==1&&!s3Blocked}
                onSelect={()=>setSelectedCard(selectedCard===card.id?null:card.id)}/>
            </div>
          ))
        }
      </div>
      {/* Drop zone */}
      {isDayOpen&&!submitted&&!s3Blocked&&(
        <div onDragOver={e=>{e.preventDefault();setDragOver(true);}}
          onDragLeave={()=>setDragOver(false)} onDrop={handleDrop}
          style={{border:`2px dashed ${dragOver?"#2D7D52":"#D9D4C8"}`,borderRadius:8,padding:20,textAlign:"center",background:dragOver?"#DCFCE7":"#FAFAF8",transition:"all 0.15s",marginBottom:8}}>
          <div style={{fontSize:13,color:dragOver?"#2D7D52":"#94A3B8",fontWeight:dragOver?600:400}}>
            {dragOver?`✓ ${t.dropOver}`:t.dropZone}
          </div>
          <div style={{fontSize:11,color:"#94A3B8",marginTop:4}}>→ WC-{team.deck[0]?.routing[0]||"?"}</div>
        </div>
      )}
      {/* Manual release button for selected card */}
      {isDayOpen&&!submitted&&!s3Blocked&&selectedCard&&session.scenario!==1&&(
        <button style={{...G.btn("#2D7D52"),width:"100%",marginBottom:8}} onClick={()=>submit(`release:${selectedCard}`)}>
          📤 {t.releaseDeck} — {selectedCard}
        </button>
      )}
      {isDayOpen&&!submitted&&session.scenario===1&&team.deck.length>0&&(
        <button style={{...G.btn("#2D7D52"),width:"100%",marginBottom:8}} onClick={()=>submit('release')}>
          📤 {t.releaseDeck} (FIFO)
        </button>
      )}
      {isDayOpen&&!submitted&&(
        <button style={G.btn("#64748B")} onClick={()=>submit('hold')}>⏸ {t.hold}</button>
      )}
      {submitted&&<div style={{color:"#2D7D52",fontWeight:600,fontSize:14,padding:"8px 0"}}>{t.submitted}</div>}
      {!isDayOpen&&<div style={{color:"#94A3B8",fontSize:13,padding:"8px 0"}}>{t.waitDay}</div>}
    </div>
  </div>);
}

// ── OPERATOR VIEW ─────────────────────────────────────────────
function OperatorView({session,team,role,t,onUpdate}){
  const [selectedCard,setSelectedCard]=useState(null);
  const [submitted,setSubmitted]=useState(false);
  const [dragOver,setDragOver]=useState(false);

  useEffect(()=>{setSubmitted(false);setSelectedCard(null);},[session.day,session.dayPhase]);
  useEffect(()=>{
    const iv=setInterval(async()=>{const ns=await loadSession(session.code);if(ns&&(ns.day!==session.day||ns.dayPhase!==session.dayPhase))onUpdate(ns);},2500);
    return()=>clearInterval(iv);
  },[session.code,session.day,session.dayPhase]);

  const wcKey=role.split("-")[1].toUpperCase();
  const myQueue=team.queues[wcKey]||[];
  const isS1=session.scenario===1;
  const isDayOpen=session.dayPhase==="open";

  const submit=async(cardId)=>{
    setSubmitted(true);
    setSelectedCard(cardId);
    await saveAction(session.code,team.id,role,session.day,cardId||'pass');
  };

  const handleDragStart=(e,cardId)=>{
    if(isS1&&myQueue.length>0&&cardId!==myQueue[0].id) return;
    e.dataTransfer.setData("cardId",cardId);
  };

  const handleDrop=async(e)=>{
    e.preventDefault();setDragOver(false);
    if(submitted||!isDayOpen) return;
    const cardId=e.dataTransfer.getData("cardId");
    if(!cardId) return;
    if(isS1&&myQueue.length>0&&cardId!==myQueue[0].id){
      alert("S1 — FIFO : vous devez traiter la première carte de la file.");
      return;
    }
    await submit(cardId);
  };

  const firstCard=myQueue[0];
  const effectiveSelected=isS1?(firstCard?.id||null):selectedCard;

  return(<div style={{padding:16}}>
    <TeamMini team={team} t={t}/>
    <div style={{...G.card,marginTop:8}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div style={{fontWeight:700,fontSize:13,color:wcKey==="B"?"#D4500A":"#1B3A4B",display:"flex",alignItems:"center",gap:6}}>
          {t.roles[role]}
          {wcKey==="B"&&<span style={{fontSize:9,background:"#D4500A",color:"#fff",padding:"1px 5px",borderRadius:3}}>{t.goulot}</span>}
        </div>
        <span style={{fontSize:12,color:"#64748B"}}>{t.yourQ}: <b>{myQueue.length}</b></span>
      </div>

      {/* Card queue */}
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:12,minHeight:60}}>
        {myQueue.length===0
          ?<div style={{color:"#94A3B8",fontSize:13,padding:"12px 0"}}>{t.emptyQ}</div>
          :myQueue.map((card,i)=>{
            const isFirst=i===0;
            const canDrag=isDayOpen&&!submitted&&(!isS1||isFirst);
            const canSelect=isDayOpen&&!submitted&&!isS1;
            return(
              <div key={card.id}
                draggable={canDrag}
                onDragStart={e=>handleDragStart(e,card.id)}
                style={{opacity:isS1&&!isFirst?0.5:1, cursor:canDrag?"grab":"default"}}>
                <OrderCard card={card}
                  selected={effectiveSelected===card.id}
                  selectable={canSelect}
                  onSelect={()=>canSelect&&setSelectedCard(selectedCard===card.id?null:card.id)}/>
              </div>
            );
          })
        }
      </div>

      {/* Drop zone */}
      {isDayOpen&&!submitted&&myQueue.length>0&&(
        <div onDragOver={e=>{e.preventDefault();setDragOver(true);}}
          onDragLeave={()=>setDragOver(false)} onDrop={handleDrop}
          style={{border:`2px dashed ${dragOver?"#2D7D52":"#D9D4C8"}`,borderRadius:8,padding:16,textAlign:"center",background:dragOver?"#DCFCE7":"#FAFAF8",transition:"all 0.15s",marginBottom:8}}>
          <div style={{fontSize:13,color:dragOver?"#2D7D52":"#94A3B8",fontWeight:dragOver?600:400}}>
            {dragOver?`✓ ${t.dropOver}`:t.dropZone}
          </div>
          {isS1&&<div style={{fontSize:10,color:"#94A3B8",marginTop:2}}>S1 — FIFO : première carte uniquement</div>}
        </div>
      )}

      {/* Click-to-select fallback for S2/S3 */}
      {isDayOpen&&!submitted&&!isS1&&selectedCard&&(
        <button style={{...G.btn(wcKey==="B"?"#D4500A":"#1B3A4B"),width:"100%",marginBottom:8}} onClick={()=>submit(selectedCard)}>
          ⚙ {t.chooseTreat} — {selectedCard}
        </button>
      )}
      {isDayOpen&&!submitted&&isS1&&myQueue.length>0&&(
        <button style={{...G.btn(wcKey==="B"?"#D4500A":"#1B3A4B"),width:"100%",marginBottom:8}} onClick={()=>submit(myQueue[0].id)}>
          ⚙ {t.proc} — {myQueue[0].id} (FIFO)
        </button>
      )}
      {isDayOpen&&!submitted&&(
        <button style={G.btn("#64748B")} onClick={()=>submit('pass')}>⏭ {t.pass}</button>
      )}
      {submitted&&<div style={{color:"#2D7D52",fontWeight:600,fontSize:14,padding:"8px 0"}}>{t.submitted}</div>}
      {!isDayOpen&&<div style={{color:"#94A3B8",fontSize:13,padding:"8px 0"}}>{t.waitDay}</div>}
    </div>
  </div>);
}

// ── LIVE CHARTS MODAL ─────────────────────────────────────────
function LiveChartsModal({results,t,onClose}){
  const scatterRef=useRef(null);const scatterChart=useRef(null);
  const barRef=useRef(null);const barChart=useRef(null);

  const names=t.scnNames.slice(1);
  const scnData=[1,2,3].map(i=>results[i]?.completed||null);

  useEffect(()=>{
    if(!scatterRef.current) return;
    if(scatterChart.current){scatterChart.current.destroy();scatterChart.current=null;}
    const datasets=scnData.map((d,i)=>d?{label:names[i],data:d.map(c=>({x:c.releaseDay,y:c.flowDays})).filter(p=>p.x!=null),backgroundColor:SC[i],pointRadius:4}:null).filter(Boolean);
    if(!datasets.length) return;
    scatterChart.current=new Chart(scatterRef.current,{type:"scatter",data:{datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:10,font:{size:10}}}},scales:{x:{title:{display:true,text:t.relDay,font:{size:10}},ticks:{font:{size:9}}},y:{title:{display:true,text:t.flowDays,font:{size:10}},ticks:{font:{size:9}}}}}});
    return()=>{if(scatterChart.current){scatterChart.current.destroy();scatterChart.current=null;}};
  },[JSON.stringify(results)]);

  useEffect(()=>{
    if(!barRef.current) return;
    if(barChart.current){barChart.current.destroy();barChart.current=null;}
    const allFlows=scnData.filter(Boolean).flatMap(d=>d.map(c=>c.flowDays).filter(v=>v!=null));
    if(!allFlows.length) return;
    const mx=Math.max(...allFlows);
    const labels=Array.from({length:mx},(_,i)=>String(i+1));
    const datasets=scnData.map((d,i)=>d?{label:names[i],data:Array.from({length:mx},(_,j)=>d.filter(c=>c.flowDays===j+1).length),backgroundColor:SC[i]}:null).filter(Boolean);
    if(!datasets.length) return;
    barChart.current=new Chart(barRef.current,{type:"bar",data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:10,font:{size:10}}}},scales:{x:{ticks:{font:{size:9}}},y:{ticks:{font:{size:9},stepSize:1}}}}});
    return()=>{if(barChart.current){barChart.current.destroy();barChart.current=null;}};
  },[JSON.stringify(results)]);

  return(
    <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.6)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:"#fff",borderRadius:12,padding:20,width:"100%",maxWidth:800,maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <h3 style={{margin:0,color:"#1B3A4B"}}>{t.liveCharts}</h3>
          <button style={G.btn("#64748B")} onClick={onClose}>{t.closeModal}</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <div style={G.card}>
            <div style={{fontWeight:600,fontSize:12,marginBottom:8,color:"#1B3A4B"}}>{t.scatterT}</div>
            <div style={{height:220,position:"relative"}}><canvas ref={scatterRef}/></div>
          </div>
          <div style={{...G.card,overflowX:"auto"}}>
            <div style={{fontWeight:600,fontSize:12,marginBottom:8,color:"#1B3A4B"}}>{t.histoT}</div>
            <div style={{height:220,position:"relative",minWidth:400}}><canvas ref={barRef}/></div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── FACILITATOR VIEW ──────────────────────────────────────────
function FacilitatorView({session,onUpdate,t,onDebrief}){
  const [actStatus,setActStatus]=useState({});
  const [loading,setLoading]=useState(false);
  const [showCharts,setShowCharts]=useState(false);
  const teams=Object.values(session.teams||{});
  const isPlaying=session.dayPhase==="open"||session.dayPhase==="idle";
  const isScnEnd=session.dayPhase==="scnEnd";
  const isSetup=!session.scenario||session.status==="lobby"||session.status==="setup";

  useEffect(()=>{
    if(session.dayPhase!=="open") return;
    const iv=setInterval(async()=>{
      const st={};
      for(const tm of teams) st[tm.id]=await loadAllActions(session.code,tm.id,session.day);
      setActStatus(st);
      // Auto-close check
      const humanRoles=teams.flatMap(tm=>getHumanRoles(tm));
      const gotActs=teams.reduce((n,tm)=>n+Object.keys(st[tm.id]||{}).filter(r=>r!=="monitor"&&!isAuto(tm,r)).length,0);
      if(gotActs>=humanRoles.length&&humanRoles.length>0){
        clearInterval(iv);
        await doCloseDay(st);
      }
    },2500);
    return()=>clearInterval(iv);
  },[session.dayPhase,session.day]);

  const doCloseDay=async(acts)=>{
    setLoading(true);
    const updTeams={...session.teams};
    for(const tm of teams){
      const a=acts||await loadAllActions(session.code,tm.id,session.day);
      updTeams[tm.id]=applyDay(tm,session.day,session.scenario,a);
    }
    const allDone=Object.values(updTeams).every(tm=>tm.deck.length===0&&WCS.every(wc=>tm.queues[wc].length===0));
    const ns={...session,teams:updTeams,dayPhase:allDone?"scnEnd":"idle"};
    await saveSession(session.code,ns);onUpdate(ns);setLoading(false);
  };

  const openDay=async()=>{
    const ns={...session,dayPhase:"open",day:session.day+1};
    setActStatus({});
    await saveSession(session.code,ns);onUpdate(ns);
  };

  const startScenario=async(scnNum)=>{
    const newTeams={};
    Object.values(session.teams).forEach(tm=>{newTeams[tm.id]={...tm,deck:mkDeck(),queues:{A:[],B:[],C:[],D:[]},completed:[],bufferB:0};});
    const ns={...session,scenario:scnNum,day:0,dayPhase:"idle",status:"playing",teams:newTeams};
    await saveSession(session.code,ns);onUpdate(ns);
  };

  const goNext=async()=>{
    const res={...session.results};
    res[session.scenario]={completed:Object.values(session.teams).flatMap(tm=>tm.completed)};
    const nxt=session.scenario+1;
    if(nxt>3){const ns={...session,results:res,status:"finished"};await saveSession(session.code,ns);onDebrief(res);return;}
    const newTeams={};
    Object.values(session.teams).forEach(tm=>{newTeams[tm.id]={...tm,deck:mkDeck(),queues:{A:[],B:[],C:[],D:[]},completed:[],bufferB:0};});
    const ns={...session,scenario:nxt,day:0,dayPhase:"idle",teams:newTeams,results:res};
    await saveSession(session.code,ns);onUpdate(ns);
  };

  const humanRoles=teams.flatMap(tm=>getHumanRoles(tm));
  const gotActs=teams.reduce((n,tm)=>n+Object.keys(actStatus[tm.id]||{}).filter(r=>r!=="monitor"&&!isAuto(tm,r)).length,0);
  const allIn=gotActs>=humanRoles.length&&humanRoles.length>0;

  // Played scenarios
  const played=session.results?Object.keys(session.results).filter(k=>session.results[k]!=null).map(Number):[];

  return(<div style={{padding:16}}>
    {showCharts&&<LiveChartsModal results={session.results||{}} t={t} onClose={()=>setShowCharts(false)}/>}

    {/* Scenario buttons */}
    <div style={{...G.card,marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <div style={G.row}>
          {[1,2,3].map(s=>{
            const active=session.scenario===s&&session.status==="playing";
            const done=played.includes(s);
            return(
              <button key={s} style={{...G.btn(active?SC[s-1]:done?"#94A3B8":"#1B3A4B"),opacity:active||!done?1:0.7,fontSize:12,padding:"7px 14px"}}
                onClick={()=>!active&&startScenario(s)}>
                {done&&!active?"✓ ":""}{t.startScn} S{s} — {t.scnNames[s]}
              </button>
            );
          })}
          <button style={{...G.btn("#64748B"),fontSize:12,padding:"7px 14px"}} onClick={()=>setShowCharts(true)}>{t.liveCharts}</button>
          {played.length>0&&<button style={{...G.ghost,fontSize:12,padding:"7px 14px"}} onClick={()=>onDebrief(session.results)}>📊 {t.viewDeb}</button>}
        </div>
        {session.scenario&&session.status==="playing"&&(
          <div style={G.row}>
            <span style={{...G.tag(SC[session.scenario-1]),fontSize:12,padding:"3px 8px"}}>S{session.scenario} — {t.scnNames[session.scenario]}</span>
            <span style={{fontWeight:700,fontSize:16,color:"#1B3A4B"}}>{t.day} {session.day}</span>
            {session.dayPhase==="open"&&<span style={{...G.tag("#2D7D52"),fontSize:11}}>● ouvert</span>}
            {isScnEnd&&<span style={{...G.tag("#D4500A"),fontSize:11}}>{t.scnDone}</span>}
          </div>
        )}
      </div>
    </div>

    {/* Day controls */}
    {session.status==="playing"&&(
      <div style={{...G.card,marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <div style={G.row}>
          {session.dayPhase==="idle"&&!isScnEnd&&<button style={G.btn("#2D7D52")} onClick={openDay}>▶ {t.day} {session.day+1}</button>}
          {session.dayPhase==="open"&&(
            <>
              <span style={{fontSize:12,color:allIn?"#2D7D52":"#64748B"}}>
                {allIn?`✓ ${t.actsIn}`:`${humanRoles.length-gotActs} ${t.actsPend}`}
              </span>
              <button style={G.btn("#D4500A")} onClick={()=>doCloseDay(null)} disabled={loading}>{loading?"…":t.forceClose}</button>
            </>
          )}
          {isScnEnd&&<button style={G.btn("#D4500A")} onClick={goNext}>{session.scenario<3?`→ ${t.nextScn}`:`📊 ${t.viewDeb}`}</button>}
        </div>
        {/* Action status */}
        {session.dayPhase==="open"&&(
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {teams.flatMap(tm=>ROLES.filter(r=>r!=="monitor").map(r=>{
              const auto=isAuto(tm,r),got=actStatus[tm.id]?.[r];
              return(
                <span key={tm.id+r} style={{fontSize:11,padding:"2px 7px",borderRadius:4,background:auto?"#FEF3C7":got?"#DCFCE7":"#F1F5F9",color:auto?"#D4500A":got?"#2D7D52":"#94A3B8",border:`1px solid ${auto?"#F59E0B44":got?"#2D7D5244":"#E2E8F0"}`,fontWeight:600}}>
                  {auto?"🤖":got?"✓":"○"} {t.roles[r]}
                </span>
              );
            }))}
          </div>
        )}
      </div>
    )}

    {/* Team dashboards */}
    {teams.map(tm=>(
      <div key={tm.id} style={{...G.card,marginBottom:12}}>
        <div style={{fontWeight:700,color:"#1B3A4B",marginBottom:10}}>{tm.name}</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {WCS.map(wc=>(
            <div key={wc} style={{background:wc==="B"?"#FFFBEB":"#F9FAFB",border:`2px solid ${wc==="B"?"#D4500A":"#E5E7EB"}`,borderRadius:8,padding:10,flex:1,minWidth:140}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <div style={{display:"flex",alignItems:"center",gap:4}}>
                  <span style={{fontWeight:700,fontSize:13,color:wc==="B"?"#D4500A":"#1B3A4B"}}>WC-{wc}</span>
                  {wc==="B"&&<span style={{fontSize:8,background:"#D4500A",color:"#fff",padding:"1px 4px",borderRadius:3}}>{t.goulot}</span>}
                </div>
                <span style={{...G.tag(wc==="B"?"#D4500A":"#64748B"),fontSize:10}}>{tm.queues[wc]?.length||0}</span>
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                {(tm.queues[wc]||[]).map(card=><OrderCard key={card.id} card={card} compact/>)}
              </div>
            </div>
          ))}
        </div>
        <div style={{marginTop:8,display:"flex",gap:6,flexWrap:"wrap"}}>
          {[...tm.completed].slice(-6).map(card=><OrderCard key={card.id} card={card} compact/>)}
          {tm.completed.length>6&&<span style={{fontSize:11,color:"#64748B",alignSelf:"center"}}>+{tm.completed.length-6}</span>}
        </div>
      </div>
    ))}
  </div>);
}

// ── STATS BOX ─────────────────────────────────────────────────
function StatsBox({st,t,color,name}){
  if(!st)return(<div style={{...G.card,textAlign:"center",color:"#CBD5E1",padding:24}}><div style={{fontSize:28,margin:"0 0 6px"}}>—</div><div style={{fontSize:12}}>{t.noData}</div></div>);
  return(<div style={{...G.card,borderTop:`3px solid ${color}`}}>
    <div style={{fontWeight:700,color,marginBottom:10,fontSize:13}}>{name}</div>
    {[[t.count,st.count],[t.min,st.min],[t.max,st.max],[t.avg,st.avg],[t.stddev,st.stddev],[t.median,st.median]].map(([l,v])=>(
      <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"3px 0",borderBottom:"1px solid #F8FAFC"}}>
        <span style={{fontSize:12,color:"#64748B"}}>{l}</span><span style={{fontSize:13,fontWeight:700}}>{v}</span>
      </div>
    ))}
  </div>);
}

// ── DEBRIEF SCREEN ────────────────────────────────────────────
function DebriefScreen({results,t,onNew}){
  const names=t.scnNames.slice(1);
  const scnData=[1,2,3].map(i=>results[i]?.completed||null);
  const statsArr=scnData.map(d=>d?computeStats(d):null);
  const scatterRef=useRef(null);const scatterChart=useRef(null);
  const barRef=useRef(null);const barChart=useRef(null);

  useEffect(()=>{
    if(!scatterRef.current) return;
    if(scatterChart.current){scatterChart.current.destroy();scatterChart.current=null;}
    const datasets=scnData.map((d,i)=>d?{label:names[i],data:d.map(c=>({x:c.releaseDay,y:c.flowDays})).filter(p=>p.x!=null&&p.y!=null),backgroundColor:SC[i],pointRadius:5}:null).filter(Boolean);
    if(!datasets.length) return;
    scatterChart.current=new Chart(scatterRef.current,{type:"scatter",data:{datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:10,font:{size:11}}}},scales:{x:{title:{display:true,text:t.relDay,font:{size:11}},ticks:{stepSize:1,font:{size:10}}},y:{title:{display:true,text:t.flowDays,font:{size:11}},ticks:{stepSize:1,font:{size:10}}}}}});
    return()=>{if(scatterChart.current){scatterChart.current.destroy();scatterChart.current=null;}};
  },[]);

  useEffect(()=>{
    if(!barRef.current) return;
    if(barChart.current){barChart.current.destroy();barChart.current=null;}
    const allFlows=scnData.filter(Boolean).flatMap(d=>d.map(c=>c.flowDays).filter(v=>v!=null));
    if(!allFlows.length) return;
    const mx=Math.max(...allFlows);
    const labels=Array.from({length:mx},(_,i)=>String(i+1));
    const datasets=scnData.map((d,i)=>d?{label:names[i],data:Array.from({length:mx},(_,j)=>d.filter(c=>c.flowDays===j+1).length),backgroundColor:SC[i]}:null).filter(Boolean);
    barChart.current=new Chart(barRef.current,{type:"bar",data:{labels,datasets},options:{responsive:false,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:10,font:{size:11}}}},scales:{x:{ticks:{font:{size:9}}},y:{ticks:{font:{size:10},stepSize:1}}}}});
    return()=>{if(barChart.current){barChart.current.destroy();barChart.current=null;}};
  },[]);

  const doCSV=()=>{
    const rows=[["Scenario","Card","Product","Routing","Release day","Completed day","Flow Days"]];
    [1,2,3].forEach(s=>{if(results[s])results[s].completed.forEach(c=>{rows.push([t.scnNames[s],c.id,c.product,c.routing.join(">"),c.releaseDay,c.completedDay,c.flowDays]);});});
    const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(rows.map(r=>r.join(",")).join("\n"));a.download="job-shop-game.csv";a.click();
  };

  return(<div style={{padding:16,maxWidth:1100,margin:"0 auto"}}>
    <style>{`@media print{.no-print{display:none!important}body{background:#fff}}`}</style>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16,flexWrap:"wrap",gap:8}}>
      <div><h2 style={{margin:"0 0 2px",color:"#1B3A4B",fontSize:20,fontWeight:700}}>{t.comparison}</h2><p style={{margin:0,color:"#64748B",fontSize:12}}>{t.title}</p></div>
      <div className="no-print" style={G.row}>
        <button style={G.ghost} onClick={doCSV}>⬇ {t.csv}</button>
        <button style={G.ghost} onClick={()=>window.print()}>🖨 {t.pdf}</button>
        {onNew&&<button style={G.btn()} onClick={onNew}>+ {t.newSess}</button>}
      </div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:14}}>
      {[0,1,2].map(i=><StatsBox key={i} st={statsArr[i]} t={t} color={SC[i]} name={`S${i+1} — ${names[i]}`}/>)}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
      <div style={G.card}>
        <div style={{fontWeight:600,fontSize:12,marginBottom:8,color:"#1B3A4B"}}>{t.scatterT}</div>
        <div style={{height:220,position:"relative"}}><canvas ref={scatterRef}/></div>
      </div>
      <div style={G.card}>
        <div style={{fontWeight:600,fontSize:12,marginBottom:8,color:"#1B3A4B"}}>{t.histoT} — 1 barre/jour</div>
        <div style={{overflowX:"auto"}}>
          <div style={{height:220,position:"relative",minWidth:600}}><canvas ref={barRef}/></div>
        </div>
      </div>
    </div>
    <div style={G.card}>
      <div style={{fontWeight:600,fontSize:12,marginBottom:10,color:"#1B3A4B"}}>{t.flowDays} — détail par carte</div>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead><tr style={{background:"#F8FAFC"}}>
            <th style={{padding:"6px 8px",textAlign:"left",borderBottom:"2px solid #E2E8F0",color:"#64748B",fontWeight:600}}>Carte</th>
            <th style={{padding:"6px 8px",textAlign:"left",borderBottom:"2px solid #E2E8F0",color:"#64748B",fontWeight:600}}>P</th>
            <th style={{padding:"6px 8px",textAlign:"left",borderBottom:"2px solid #E2E8F0",color:"#64748B",fontWeight:600}}>Routage</th>
            {names.map((n,i)=><th key={i} style={{padding:"6px 8px",textAlign:"right",borderBottom:`2px solid ${SC[i]}`,color:SC[i],fontWeight:700}}>S{i+1} {n}</th>)}
          </tr></thead>
          <tbody>
            {Array.from({length:36},(_,i)=>{
              const p=Math.floor(i/9)+1,c=(i%9)+1,id=`P${p}-${c}`;
              const vals=[1,2,3].map(s=>results[s]?.completed?.find(x=>x.id===id)||null);
              if(vals.every(v=>!v)) return null;
              return(<tr key={id} style={{borderBottom:"1px solid #F1F5F9"}}>
                <td style={{padding:"4px 8px",fontFamily:"monospace",fontWeight:700}}>{id}</td>
                <td style={{padding:"4px 8px"}}><span style={G.tag(PC[p])}>{p}</span></td>
                <td style={{padding:"4px 8px",fontFamily:"monospace",fontSize:10,color:"#94A3B8"}}>{ROUTINGS[p].join("→")}</td>
                {vals.map((v,j)=><td key={j} style={{padding:"4px 8px",textAlign:"right",fontWeight:v?700:400,color:v?SC[j]:"#E2E8F0"}}>{v?v.flowDays:"—"}</td>)}
              </tr>);
            }).filter(Boolean)}
          </tbody>
        </table>
      </div>
    </div>
  </div>);
}

        {[{credit:w.credit,author:w.author,role:w.role,univ:w.univ,contact:w.contact},{credit:w.credit2,author:w.author2,role:w.role2,contact:w.contact2}].map((cr,i)=>(
          <div key={i} style={{textAlign:"center",padding:"12px 14px",background:"#fff",borderRadius:10,border:"1px solid #D9D4C8"}}>
            <div style={{fontSize:10,color:"#94A3B8",marginBottom:6,letterSpacing:1,textTransform:"uppercase",fontWeight:600}}>{cr.credit}</div>

            {cr.univ&&<div style={{fontSize:11,color:"#64748B",marginBottom:6}}>{cr.univ}</div>}

// ── CONTEXT SCREEN ────────────────────────────────────────────
function ContextScreen({t,role,onReady}){
  const [tab,setTab]=useState(0);const c=t.ctx;
  return(<div style={{...G.bg,minHeight:"100vh"}}>
    <div style={{maxWidth:680,margin:"0 auto",padding:"24px 16px"}}>
      <h2 style={{color:"#1B3A4B",marginBottom:4,fontSize:20}}>{c.title}</h2>
      {role&&<div style={{marginBottom:16}}><span style={{...G.tag("#1B3A4B"),background:"#1B3A4B22",color:"#1B3A4B"}}>{t.roles[role]}</span></div>}
      <div style={{display:"flex",borderBottom:"2px solid #D9D4C8",marginBottom:20}}>
        {c.tabs.map((tb,i)=>(<button key={i} onClick={()=>setTab(i)} style={{padding:"8px 16px",border:"none",cursor:"pointer",fontWeight:tab===i?700:400,borderBottom:`2px solid ${tab===i?"#1B3A4B":"transparent"}`,marginBottom:-2,background:"transparent",color:tab===i?"#1B3A4B":"#64748B",fontSize:13}}>{tb}</button>))}
      </div>

        {c.game.map((txt,i)=><p key={i} style={{margin:0,lineHeight:1.6,color:"#374151",fontSize:14}}>{txt}</p>)}
        <div style={{...G.card,padding:12}}><div style={{fontWeight:600,fontSize:12,color:"#1B3A4B",marginBottom:8}}>Routages</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>{[1,2,3,4].map(p=>(<div key={p} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 8px",background:"#F8FAFC",borderRadius:6}}><span style={{...G.tag(PC[p]),fontSize:11}}>P{p}</span><span style={{fontSize:12,fontFamily:"monospace",color:"#374151"}}>{ROUTINGS[p].join("→")}</span>{p===4&&<span style={{fontSize:9,color:"#D4500A",fontWeight:700}}>2×B</span>}</div>))}</div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:6}}>{c.scnTitles.map((title,i)=>(<div key={i} style={{display:"flex",gap:10,alignItems:"flex-start",padding:"8px 12px",background:"#fff",borderRadius:8,border:`2px solid ${SC[i]}22`}}><span style={{...G.tag(SC[i]),fontSize:11,flexShrink:0}}>{title}</span><span style={{fontSize:13,color:"#374151"}}>{c.scnTexts[i]}</span></div>))}</div>
      </div>)}
      {tab===1&&role&&(<div style={G.col}>
        <div style={{...G.card,borderTop:`3px solid ${role==="wc-b"?"#D4500A":"#1B3A4B"}`}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
            <span style={{fontWeight:700,fontSize:16,color:role==="wc-b"?"#D4500A":"#1B3A4B"}}>{t.roles[role]}</span>
            {role==="wc-b"&&<span style={{fontSize:10,background:"#D4500A",color:"#fff",padding:"2px 6px",borderRadius:3,fontWeight:700}}>{t.goulot}</span>}
          </div>
          <p style={{margin:"0 0 12px",color:"#64748B",fontSize:13}}>{t.rdesc[role]}</p>
          <ul style={{margin:0,padding:"0 0 0 16px",display:"flex",flexDirection:"column",gap:6}}>
            {(c.roleDetails[role]||[]).map((tip,i)=>(<li key={i} style={{fontSize:13,color:"#374151",lineHeight:1.5}}>{tip}</li>))}
          </ul>
        </div>
      </div>)}
      {tab===2&&(<div style={G.col}>
        <div style={G.card}><div style={{fontWeight:600,fontSize:13,color:"#1B3A4B",marginBottom:12}}>{c.howTitle}</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>{c.steps.map((step,i)=>(<div key={i} style={{display:"flex",gap:10,alignItems:"flex-start"}}>
            <span style={{width:22,height:22,borderRadius:"50%",background:"#1B3A4B",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0}}>{i+1}</span>

      <div style={{marginTop:24,textAlign:"center"}}>

}

// ── MAIN APP ──────────────────────────────────────────────────
function App(){
  const [lang,setLang]=useState("fr");const t=I18N[lang];
  const [tab,setTab]=useState("create");
  const [name,setName]=useState("");const [codeInput,setCodeInput]=useState("");
  const [err,setErr]=useState("");const [sessionCode,setSessionCode]=useState("");
  const [isFac,setIsFac]=useState(false);const [myTeam,setMyTeam]=useState("team1");
  const [myRole,setMyRole]=useState("");const [session,setSession]=useState(null);
  const [debrief,setDebrief]=useState(null);const [view,setView]=useState("welcome");
  const [loading,setLoading]=useState(false);const [numTeams,setNumTeams]=useState(1);
  const [showHelp,setShowHelp]=useState(false);

  const doCreate=async()=>{
    if(!name.trim()){setErr(t.enterName);return;}setLoading(true);
    const code=genCode();const teams={};
    for(let i=1;i<=numTeams;i++) teams[`team${i}`]=mkTeam(`team${i}`,`${t.team} ${i}`);
    const ns={code,facilitatorName:name.trim(),scenario:null,day:0,dayPhase:"idle",status:"setup",teams,results:{1:null,2:null,3:null},lang};
    await saveSession(code,ns);setSession(ns);setSessionCode(code);setIsFac(true);setView("context");setLoading(false);
  };
  const doJoin=async()=>{
    if(!name.trim()){setErr(t.enterName);return;}if(codeInput.length!==6){setErr(t.invalidCode);return;}setLoading(true);
    const s=await loadSession(codeInput.toUpperCase());
    if(!s){setErr(t.invalidCode);setLoading(false);return;}
    setSession(s);setSessionCode(codeInput.toUpperCase());setView("chooseRole");setLoading(false);setErr("");
  };
  const doPickRole=async(tmId,role)=>{
    if(session.teams[tmId]?.players[role]){setErr(t.roleTaken);return;}
    const ns=JSON.parse(JSON.stringify(session));ns.teams[tmId].players[role]=name.trim();
    await saveSession(sessionCode,ns);setSession(ns);setMyTeam(tmId);setMyRole(role);setView("context");
  };
  const doStart=async()=>{const ns={...session,status:"setup"};await saveSession(sessionCode,ns);setSession(ns);setView("game");};
  const reset=()=>{setView("welcome");setSession(null);setSessionCode("");setIsFac(false);setMyRole("");setDebrief(null);setErr("");};

  const Header=()=>(<div style={G.hdr}>
    <div style={{display:"flex",alignItems:"center",gap:8}}>
      <span>⚙</span><span style={{fontWeight:700,fontSize:14}}>{t.title}</span>
      {sessionCode&&<span style={{fontSize:11,opacity:0.5,fontFamily:"monospace",marginLeft:4}}>{sessionCode}</span>}
    </div>
    <div style={G.row}>
      {session&&isFac&&<span style={{...G.tag("#F59E0B"),fontSize:11}}>{t.fac}</span>}
      {session&&!isFac&&myRole&&<span style={{...G.tag("#93C5FD"),fontSize:11}}>{t.roles[myRole]}</span>}
      {view==="game"&&<button onClick={()=>setShowHelp(true)} style={{background:"rgba(255,255,255,0.15)",color:"#fff",border:"1px solid rgba(255,255,255,0.3)",borderRadius:"50%",width:26,height:26,cursor:"pointer",fontWeight:700,fontSize:12,padding:0}}>?</button>}
      <button onClick={()=>setLang(lang==="fr"?"en":"fr")} style={{background:"transparent",color:"#fff",border:"1px solid rgba(255,255,255,0.25)",borderRadius:4,padding:"3px 8px",cursor:"pointer",fontSize:11}}>{lang==="fr"?"EN":"FR"}</button>
      {view!=="welcome"&&view!=="landing"&&<button onClick={reset} style={{background:"transparent",color:"rgba(255,255,255,0.4)",border:"none",cursor:"pointer",fontSize:13}}>✕</button>}
    </div>
  </div>);

  if(view==="welcome") return <WelcomeScreen t={t} onStart={()=>setView("landing")}/>;

  if(view==="landing") return(<div style={G.bg}><Header/>
    <div style={G.center}>
      <div><div style={{fontSize:30,marginBottom:4}}>⚙</div><h1 style={{margin:"0 0 4px",color:"#1B3A4B",fontSize:22,fontWeight:800}}>{t.title}</h1><p style={{margin:0,color:"#64748B",fontSize:13}}>{t.sub}</p></div>
      <div style={{...G.card,width:"100%",maxWidth:380}}>
        <div style={{marginBottom:14}}><label style={{fontSize:12,fontWeight:600,color:"#64748B",display:"block",marginBottom:4}}>{t.yourName}</label><input style={G.inp} value={name} onChange={e=>setName(e.target.value)} placeholder={t.yourName} autoFocus onKeyDown={e=>e.key==="Enter"&&(tab==="create"?doCreate():doJoin())}/></div>
        <div style={{display:"flex",borderRadius:8,overflow:"hidden",border:"1.5px solid #D9D4C8",marginBottom:14}}>
          {["create","join"].map((tb,i)=>(<button key={tb} onClick={()=>{setTab(tb);setErr("");}} style={{flex:1,padding:"8px",border:"none",cursor:"pointer",fontWeight:600,fontSize:13,background:tab===tb?"#1B3A4B":"#FAFAF8",color:tab===tb?"#fff":"#64748B"}}>{i===0?t.create:t.join}</button>))}
        </div>
        {tab==="create"&&(<div style={{marginBottom:14}}><label style={{fontSize:12,fontWeight:600,color:"#64748B",display:"block",marginBottom:4}}>{t.numTeams}</label><div style={{display:"flex",gap:6}}>{[1,2,3].map(n=><button key={n} onClick={()=>setNumTeams(n)} style={{flex:1,padding:"8px",border:`2px solid ${numTeams===n?"#1B3A4B":"#D9D4C8"}`,borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:15,background:numTeams===n?"#1B3A4B":"#fff",color:numTeams===n?"#fff":"#64748B"}}>{n}</button>)}</div></div>)}
        {tab==="join"&&(<div style={{marginBottom:14}}><label style={{fontSize:12,fontWeight:600,color:"#64748B",display:"block",marginBottom:4}}>{t.code}</label><input style={{...G.inp,fontFamily:"'Courier New',monospace",textAlign:"center",fontSize:22,letterSpacing:8}} value={codeInput} onChange={e=>setCodeInput(e.target.value.toUpperCase())} placeholder="· · · · · ·" maxLength={6} onKeyDown={e=>e.key==="Enter"&&doJoin()}/></div>)}
        {err&&<div style={{color:"#D4500A",fontSize:12,marginBottom:8,textAlign:"center"}}>{err}</div>}
        <button style={{...G.btn(tab==="create"?"#1B3A4B":"#D4500A"),width:"100%",padding:"11px",fontSize:14}} onClick={tab==="create"?doCreate:doJoin} disabled={loading}>{loading?"…":(tab==="create"?t.createBtn:t.joinBtn)}</button>
      </div>
    </div>
  </div>);

  if(view==="chooseRole"&&session) return(<div style={G.bg}><Header/>
    <div style={{padding:"20px 16px",maxWidth:580,margin:"0 auto"}}>
      <h3 style={{color:"#1B3A4B",marginBottom:16,fontSize:16}}>{t.chooseRole}</h3>
      {Object.keys(session.teams).map(tk=>{const tm=session.teams[tk];return(<div key={tk} style={{...G.card,marginBottom:12}}>
        <div style={{fontWeight:700,marginBottom:10}}>{tm.name}</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {ROLES.map(role=>{const taken=!!tm.players[role],isB=role==="wc-b";return(
            <button key={role} disabled={taken} style={{background:taken?"#F8FAFC":isB?"#FFFBEB":"#FAFAF8",border:`2px solid ${taken?"#F1F5F9":isB?"#D4500A":"#D9D4C8"}`,borderRadius:8,padding:"10px",cursor:taken?"default":"pointer",textAlign:"left",opacity:taken?0.5:1}} onClick={()=>!taken&&doPickRole(tk,role)}>
              <div style={{fontWeight:700,fontSize:13,color:taken?"#CBD5E1":isB?"#D4500A":"#1B3A4B",display:"flex",alignItems:"center",gap:4}}>{taken?"✓ ":""}{t.roles[role]}{isB&&!taken&&<span style={{fontSize:9,background:"#D4500A",color:"#fff",padding:"1px 4px",borderRadius:3}}>{t.goulot}</span>}</div>
              {taken?<div style={{fontSize:11,color:"#CBD5E1"}}>{tm.players[role]}</div>:<div style={{fontSize:11,color:"#94A3B8",marginTop:2}}>{t.rdesc[role]}</div>}
            </button>);
          })}
        </div>
      </div>);})}
      {err&&<div style={{color:"#D4500A",fontSize:12}}>{err}</div>}
    </div>
  </div>);

  if(view==="context") return(<div style={G.bg}><Header/><ContextScreen t={t} role={myRole} onReady={()=>{if(isFac)setView("lobby");else if(session?.status==="playing")setView("game");else setView("lobby");}}/></div>);

  if(view==="lobby"&&session) return(<div style={G.bg}><Header/>
    <div style={{padding:"20px 16px",maxWidth:540,margin:"0 auto"}}>
      <div style={{...G.card,marginBottom:16,textAlign:"center"}}>
        <div style={{fontSize:11,color:"#64748B",marginBottom:6,fontWeight:600,letterSpacing:1,textTransform:"uppercase"}}>{t.shareCode}</div>
        <div style={{fontFamily:"'Courier New',monospace",fontSize:44,fontWeight:700,color:"#1B3A4B",letterSpacing:14,padding:"4px 0"}}>{sessionCode}</div>
      </div>
      {Object.values(session.teams).map(tm=>(<div key={tm.id} style={{...G.card,marginBottom:12}}>
        <div style={{fontWeight:700,marginBottom:8}}>{tm.name}</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
          {ROLES.map(role=>{const pl=tm.players[role],auto=isAuto(tm,role);return(
            <div key={role} style={{background:pl?"#DCFCE7":auto?"#FEF3C7":"#F8FAFC",border:`1px solid ${pl?"#2D7D5244":auto?"#F59E0B44":"#E2E8F0"}`,borderRadius:6,padding:"4px 10px",fontSize:12}}>
              <span style={{color:"#64748B"}}>{t.roles[role]}: </span>
              <span style={{fontWeight:600,color:pl?"#2D7D52":auto?"#D4500A":"#CBD5E1"}}>{pl||auto?"🤖":"—"}</span>
            </div>);
          })}
        </div>
      </div>))}
      {isFac&&<button style={{...G.btn("#2D7D52"),width:"100%",padding:"13px",fontSize:15}} onClick={doStart}>▶ {t.start}</button>}
      {!isFac&&<div style={{textAlign:"center",color:"#64748B",fontSize:13,padding:12}}>{t.waitStart}</div>}
    </div>
  </div>);

  if(view==="game"&&session){
    const team=session.teams[myTeam];
    // Sync session for non-facilitators
    const PlayerSync=()=>{
      useEffect(()=>{
        if(isFac) return;
        const iv=setInterval(async()=>{const ns=await loadSession(session.code);if(ns)setSession(ns);},2500);
        return()=>clearInterval(iv);
      },[]);
      return null;
    };
    return(<div style={G.bg}><Header/>
      {!isFac&&<PlayerSync/>}
      {showHelp&&(<div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.5)",zIndex:1000,overflowY:"auto"}}><div style={{maxWidth:600,margin:"40px auto",padding:"0 16px 40px"}}><ContextScreen t={t} role={myRole} onReady={()=>setShowHelp(false)}/></div></div>)}
      {isFac?<FacilitatorView session={session} onUpdate={setSession} t={t} onDebrief={r=>{setDebrief(r);setView("debrief");}}/>
        :!team?<div style={G.center}>{t.waitStart}</div>
        :myRole==="scheduler"?<SchedulerView session={session} team={team} t={t} onUpdate={setSession}/>
        :myRole==="monitor"?<MonitorView session={session} team={team} t={t} onUpdate={setSession}/>
        :<OperatorView session={session} team={team} role={myRole} t={t} onUpdate={setSession}/>
      }
    </div>);
  }

  if(view==="debrief"){
    const res=debrief||session?.results||{};
    return(<div style={G.bg}><Header/><DebriefScreen results={res} t={t} onNew={reset}/></div>);
  }

  return <div style={G.bg}><Header/><div style={G.center}>…</div></div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
