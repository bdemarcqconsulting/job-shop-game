// ── GAME ENGINE ───────────────────────────────────────────────
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function mkDeck(){return shuffle([1,2,3,4].flatMap(p=>Array.from({length:9},(_,i)=>({id:`P${p}-${i+1}`,product:p,copy:i+1,routing:[...ROUTINGS[p]],ops:ROUTINGS[p].map(wc=>({wc,processedDay:null,done:false})),currentOpIdx:-1,releaseDay:null,completedDay:null,flowDays:null}))));}
function mkTeam(id,name){return{id,name,players:{},deck:mkDeck(),queues:{A:[],B:[],C:[],D:[]},completed:[],bufferB:0};}
function calcBuf(team){return WCS.reduce((sum,wc)=>sum+(team.queues[wc]||[]).reduce((n,card)=>{let b=0;for(let i=card.currentOpIdx;i<card.routing.length;i++)if(card.routing[i]==="B")b++;return n+b;},0),0);}
function applyDay(team,day,scenario,actions){
  const t=JSON.parse(JSON.stringify(team));
  const bufBefore=calcBuf(t);
  WCS.forEach(wc=>{const role=`wc-${wc.toLowerCase()}`,act=actions[role];if(t.queues[wc].length>0&&(act==="process"||act==null)){const card=t.queues[wc].shift();card.ops[card.currentOpIdx].processedDay=day;card.ops[card.currentOpIdx].done=true;card.currentOpIdx++;if(card.currentOpIdx>=card.routing.length){card.completedDay=day;card.flowDays=day-card.releaseDay;t.completed.push(card);}else t.queues[card.routing[card.currentOpIdx]].push(card);}});
  const sa=actions["scheduler"]||(scenario===3?"hold":"release");
  if(t.deck.length>0){let rel=null;if(scenario===1&&sa==="release")rel=t.deck.shift();else if(scenario===2){if(sa.startsWith("release:")){const idx=t.deck.findIndex(c=>c.id===sa.slice(8));if(idx>=0)[rel]=t.deck.splice(idx,1);}else if(sa==="release")rel=t.deck.shift();}else if(scenario===3&&sa==="release"&&bufBefore<BUFFER_LIMIT)rel=t.deck.shift();if(rel){rel.releaseDay=day;rel.currentOpIdx=0;t.queues[rel.routing[0]].push(rel);}}
  t.bufferB=calcBuf(t);
  return t;
}
function computeStats(cards){const f=cards.map(c=>c.flowDays).filter(v=>v!=null).sort((a,b)=>a-b);if(!f.length)return null;const avg=f.reduce((a,b)=>a+b,0)/f.length;const med=f.length%2===0?(f[f.length/2-1]+f[f.length/2])/2:f[Math.floor(f.length/2)];return{min:f[0],max:f[f.length-1],avg:+(avg.toFixed(1)),stddev:+(Math.sqrt(f.reduce((a,v)=>a+Math.pow(v-avg,2),0)/f.length).toFixed(1)),median:med,count:f.length};}
function genCode(){const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";return Array.from({length:6},()=>c[0|Math.random()*c.length]).join("");}
function isAuto(team,role){return AUTO_ORDER.includes(role)&&!team.players[role];}
function getHumanRoles(team){return ROLES.filter(r=>r!=="monitor"&&!isAuto(team,r));}

// ── FIREBASE STORAGE ──────────────────────────────────────────
async function saveSession(code,state){await db.ref(`sessions/jsg-${code}`).set({json:JSON.stringify(state)});}
async function loadSession(code){const snap=await db.ref(`sessions/jsg-${code}`).get();if(!snap.exists())return null;const v=snap.val();return JSON.parse(v.json);}
async function saveAction(code,team,role,day,action){await db.ref(`actions/jsg-${code}-${team}-${role}-${day}`).set({json:JSON.stringify({action,ts:Date.now()})});}
async function loadAllActions(code,teamId,day){const acts={};for(const role of ROLES){const snap=await db.ref(`actions/jsg-${code}-${teamId}-${role}-${day}`).get();if(snap.exists())acts[role]=JSON.parse(snap.val().json).action;}return acts;}

function CardBadge({card,full=false}){
  const c=PC[card.product];
  if(!full)return <span style={{...G.tag(c),cursor:"default"}}>{card.id}</span>;
  return(<div style={{background:"#fff",border:`2px solid ${c}`,borderRadius:8,padding:"8px 10px",minWidth:110}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
      <span style={{fontFamily:"monospace",fontWeight:700,color:c,fontSize:12}}>{card.id}</span>
      <span style={{fontSize:9,background:c+"20",color:c,padding:"1px 5px",borderRadius:10,fontWeight:700}}>P{card.product}</span>
    </div>
    <div style={{display:"flex",gap:3}}>
      {card.routing.map((wc,i)=>(<span key={i} style={{width:20,height:20,borderRadius:3,fontSize:10,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",background:card.ops[i]?.done?"#DCFCE7":(i===card.currentOpIdx?(wc==="B"?"#D4500A":"#1B3A4B"):"#F0EDE6"),color:card.ops[i]?.done?"#2D7D52":(i===card.currentOpIdx?"#fff":"#9CA3AF")}}>{wc}</span>))}
    </div>
    {card.flowDays!=null&&<div style={{fontSize:10,color:"#2D7D52",fontWeight:700,marginTop:3}}>✓ {card.flowDays}j</div>}
  </div>);
}

function WCCol({wc,q=[],t}){
  return(<div style={{background:wc==="B"?"#FFFBEB":"#F9FAFB",border:`2px solid ${wc==="B"?"#D4500A":"#E5E7EB"}`,borderRadius:8,padding:10,flex:1,minWidth:0}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
      <div style={{display:"flex",alignItems:"center",gap:4}}>
        <span style={{fontWeight:700,fontSize:13,color:wc==="B"?"#D4500A":"#1B3A4B"}}>WC-{wc}</span>
        {wc==="B"&&<span style={{fontSize:8,background:"#D4500A",color:"#fff",padding:"1px 4px",borderRadius:3,fontWeight:700}}>{t.goulot}</span>}
      </div>
      <span style={{...G.tag(wc==="B"?"#D4500A":"#64748B"),fontSize:10,padding:"1px 5px"}}>{q.length}</span>
    </div>
    <div style={{display:"flex",flexDirection:"column",gap:3,maxHeight:200,overflowY:"auto"}}>
      {q.length===0?<span style={{fontSize:11,color:"#CBD5E1"}}>—</span>:q.map((card,i)=><div key={card.id} style={{opacity:i===0?1:0.6}}>{i===0?<CardBadge card={card} full/>:<CardBadge card={card}/>}</div>)}
    </div>
  </div>);
}

function TeamDash({team,t}){
  const wip=WCS.reduce((n,wc)=>n+(team.queues[wc]?.length||0),0),buf=team.bufferB||0;
  return(<div style={G.card}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:6}}>
      <span style={{fontWeight:700,color:"#1B3A4B"}}>{team.name}</span>
      <div style={G.row}>
        <span style={{fontSize:12,color:"#64748B"}}>{t.wip}: <b>{wip}</b></span>
        <span style={{fontSize:12,color:"#64748B"}}>{t.deck}: <b>{team.deck.length}</b></span>
        <span style={{fontSize:12,color:"#2D7D52",fontWeight:600}}>{t.done}: {team.completed.length}</span>
        <span style={{fontSize:12,color:buf>=BUFFER_LIMIT?"#D4500A":"#64748B",fontWeight:buf>=BUFFER_LIMIT?700:400}}>{t.buf}: {buf}/{BUFFER_LIMIT}</span>
      </div>
    </div>
    <div style={{display:"flex",gap:8}}>{WCS.map(wc=><WCCol key={wc} wc={wc} q={team.queues[wc]} t={t}/>)}</div>
  </div>);
}

function StatsBox({st,t,color,name}){

    <div style={{fontWeight:700,color,marginBottom:10,fontSize:13}}>{name}</div>
    {[[t.count,st.count],[t.min,st.min],[t.max,st.max],[t.avg,st.avg],[t.stddev,st.stddev],[t.median,st.median]].map(([l,v])=>(
      <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"3px 0",borderBottom:"1px solid #F8FAFC"}}>
        <span style={{fontSize:12,color:"#64748B"}}>{l}</span><span style={{fontSize:13,fontWeight:700}}>{v}</span>
      </div>
    ))}
  </div>);
}

function CJScatter({datasets,xLabel,yLabel}){
  const ref=useRef(null);const chart=useRef(null);
  useEffect(()=>{
    if(!ref.current||!datasets.length)return;
    if(chart.current){chart.current.destroy();chart.current=null;}
    chart.current=new Chart(ref.current,{type:"scatter",
      data:{datasets:datasets.map(d=>({label:d.name,data:d.pts,backgroundColor:d.color,pointRadius:5,pointHoverRadius:7}))},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:"bottom",labels:{boxWidth:10,font:{size:10}}}},
        scales:{x:{title:{display:true,text:xLabel,font:{size:10}},ticks:{font:{size:9}}},y:{title:{display:true,text:yLabel,font:{size:10}},ticks:{font:{size:9}}}}}});
    return()=>{if(chart.current){chart.current.destroy();chart.current=null;}};
  },[JSON.stringify(datasets)]);
  return <div style={{height:200,position:"relative"}}><canvas ref={ref}/></div>;
}

function CJBar({labels,datasets}){
  const ref=useRef(null);const chart=useRef(null);
  useEffect(()=>{
    if(!ref.current||!labels.length)return;
    if(chart.current){chart.current.destroy();chart.current=null;}
    chart.current=new Chart(ref.current,{type:"bar",
      data:{labels,datasets:datasets.map(d=>({label:d.name,data:d.data,backgroundColor:d.color}))},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:"bottom",labels:{boxWidth:10,font:{size:10}}}},
        scales:{x:{ticks:{font:{size:9}}},y:{ticks:{font:{size:9}}}}}});
    return()=>{if(chart.current){chart.current.destroy();chart.current=null;}};
  },[JSON.stringify(labels),JSON.stringify(datasets)]);
  return <div style={{height:200,position:"relative"}}><canvas ref={ref}/></div>;
}

function FacilitatorView({session,onUpdate,t,onDebrief}){
  const [actStatus,setActStatus]=useState({});
  const [loading,setLoading]=useState(false);
  const teams=Object.values(session.teams||{});
  useEffect(()=>{
    if(session.dayPhase!=="open")return;
    const iv=setInterval(async()=>{const st={};for(const tm of teams)st[tm.id]=await loadAllActions(session.code,tm.id,session.day);setActStatus(st);},2500);
    return()=>clearInterval(iv);
  },[session.dayPhase,session.day]);
  const openDay=async()=>{const ns={...session,dayPhase:"open",day:session.day+1};setActStatus({});await saveSession(session.code,ns);onUpdate(ns);};
  const closeDay=async()=>{
    setLoading(true);
    const updTeams={...session.teams};
    for(const tm of teams){const acts=await loadAllActions(session.code,tm.id,session.day);updTeams[tm.id]=applyDay(tm,session.day,session.scenario,acts);}
    const allDone=Object.values(updTeams).every(tm=>tm.deck.length===0&&WCS.every(wc=>tm.queues[wc].length===0));
    const ns={...session,teams:updTeams,dayPhase:allDone?"scnEnd":"idle"};
    await saveSession(session.code,ns);onUpdate(ns);setLoading(false);
  };
  const goNext=async()=>{
    const res={...session.results};
    res[session.scenario]={completed:Object.values(session.teams).flatMap(tm=>tm.completed)};
    const nxt=session.scenario+1;
    if(nxt>3){const ns={...session,results:res,status:"finished"};await saveSession(session.code,ns);onDebrief(res);return;}
    const newTeams={};Object.values(session.teams).forEach(tm=>{newTeams[tm.id]={...tm,deck:mkDeck(),queues:{A:[],B:[],C:[],D:[]},completed:[],bufferB:0};});
    const ns={...session,scenario:nxt,day:0,dayPhase:"idle",teams:newTeams,results:res};
    await saveSession(session.code,ns);onUpdate(ns);
  };
  const isDayOpen=session.dayPhase==="open",isScnEnd=session.dayPhase==="scnEnd";
  return(<div style={{padding:16}}>
    <div style={{...G.card,marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
      <div style={G.row}>
        <span style={{...G.tag(SC[session.scenario-1]),fontSize:13,padding:"3px 9px"}}>S{session.scenario} — {t.scnNames[session.scenario]}</span>
        <span style={{fontWeight:700,fontSize:18,color:"#1B3A4B"}}>{t.day} {session.day}</span>
        {isDayOpen&&<span style={{...G.tag("#2D7D52"),fontSize:11}}>● ouvert</span>}
        {isScnEnd&&<span style={{...G.tag("#D4500A"),fontSize:11}}>{t.scnDone}</span>}
      </div>
      <div style={G.row}>
        {!isDayOpen&&!isScnEnd&&<button style={G.btn("#2D7D52")} onClick={openDay}>▶ {t.openDay}</button>}
        {isDayOpen&&(()=>{
          const humanRoles=teams.flatMap(tm=>getHumanRoles(tm));
          const gotActs=teams.reduce((n,tm)=>n+Object.keys(actStatus[tm.id]||{}).filter(r=>r!=="monitor"&&!isAuto(tm,r)).length,0);
          const allIn=gotActs>=humanRoles.length;
          return<>
            <span style={{fontSize:12,color:allIn?"#2D7D52":"#64748B"}}>{allIn?`✓ ${t.actsIn}`:`${humanRoles.length-gotActs} ${t.actsPend}`}</span>
            <button style={G.btn("#D4500A")} onClick={closeDay} disabled={loading}>{loading?"…":`■ ${t.closeDay}`}</button>
          </>;
        })()}
        {isScnEnd&&<button style={G.btn("#D4500A")} onClick={goNext}>{session.scenario<3?`→ ${t.nextScn}`:`📊 ${t.viewDeb}`}</button>}
      </div>
    </div>
    <div style={G.col}>
      {teams.map(tm=>(<div key={tm.id}>
        <TeamDash team={tm} t={t}/>
        {isDayOpen&&(<div style={{display:"flex",gap:6,flexWrap:"wrap",padding:"6px 0 2px"}}>
          {ROLES.filter(r=>r!=="monitor").map(r=>{const auto=isAuto(tm,r),got=actStatus[tm.id]?.[r];return(
            <span key={r} style={{fontSize:11,padding:"2px 8px",borderRadius:4,background:auto?"#FEF3C7":got?"#DCFCE7":"#F1F5F9",color:auto?"#D4500A":got?"#2D7D52":"#94A3B8",border:`1px solid ${auto?"#F59E0B44":got?"#2D7D5244":"#E2E8F0"}`,fontWeight:600}}>
              {auto?`🤖 ${t.autoPilot}`:got?"✓ ":"○ "}{t.roles[r]}
            </span>);
          })}
        </div>)}
      </div>))}
    </div>
  </div>);
}

    </div>
    <div style={{...G.card,textAlign:"center",padding:24}}>
      <div style={{fontSize:11,color:wcKey==="B"?"#D4500A":"#64748B",fontWeight:700,letterSpacing:1,textTransform:"uppercase",marginBottom:4,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
        {t.roles[role]}{wcKey==="B"&&<span style={{fontSize:9,background:"#D4500A",color:"#fff",padding:"1px 5px",borderRadius:3}}>{t.goulot}</span>}
      </div>
      <div style={{fontSize:22,fontWeight:700,color:"#1B3A4B",marginBottom:14}}>{t.day} {session.day}</div>
      <div style={{marginBottom:16}}>
        <div style={{fontSize:12,color:"#64748B",marginBottom:6}}>{t.yourQ}: {myQueue.length}</div>
        {topCard?<div style={{display:"inline-block"}}><CardBadge card={topCard} full/></div>:<div style={{color:"#CBD5E1",fontSize:13,padding:12}}>{t.emptyQ}</div>}
      </div>
      {!isDayOpen?<div style={{color:"#94A3B8",fontSize:13}}>{t.waitDay}</div>:submitted?<div style={{color:"#2D7D52",fontWeight:600,fontSize:15}}>{t.submitted} — {myAct==="process"?t.proc:t.pass}</div>:(
        <div style={{display:"flex",gap:8,justifyContent:"center"}}>
          <button style={G.btn(wcKey==="B"?"#D4500A":"#1B3A4B")} disabled={!topCard} onClick={()=>submit("process")}>⚙ {t.proc}</button>
          <button style={G.btn("#64748B")} onClick={()=>submit("pass")}>⏭ {t.pass}</button>
        </div>
      )}
    </div>
    <div style={{...G.card,marginTop:12}}><div style={{display:"flex",gap:8}}>{WCS.map(wc=><WCCol key={wc} wc={wc} q={team.queues[wc]} t={t}/>)}</div></div>
  </div>);
}

// ── MAIN APP ──────────────────────────────────────────────────
function App(){
  const [lang,setLang]=useState("fr");
  const t=I18N[lang];
  const [tab,setTab]=useState("create");
  const [name,setName]=useState("");
  const [codeInput,setCodeInput]=useState("");
  const [err,setErr]=useState("");
  const [sessionCode,setSessionCode]=useState("");
  const [isFac,setIsFac]=useState(false);
  const [myTeam,setMyTeam]=useState("team1");
  const [myRole,setMyRole]=useState("");
  const [session,setSession]=useState(null);
  const [debrief,setDebrief]=useState(null);
  const [view,setView]=useState("welcome");
  const [loading,setLoading]=useState(false);
  const [numTeams,setNumTeams]=useState(1);
  const [showHelp,setShowHelp]=useState(false);

  const doCreate=async()=>{
    if(!name.trim()){setErr(t.enterName);return;}
    setLoading(true);
    const code=genCode();
    const teams={};for(let i=1;i<=numTeams;i++)teams[`team${i}`]=mkTeam(`team${i}`,`${t.team} ${i}`);
    const ns={code,facilitatorName:name.trim(),scenario:1,day:0,dayPhase:"idle",status:"lobby",teams,results:{1:null,2:null,3:null},lang};
    await saveSession(code,ns);
    setSession(ns);setSessionCode(code);setIsFac(true);setView("context");setLoading(false);
  };
  const doJoin=async()=>{
    if(!name.trim()){setErr(t.enterName);return;}
    if(codeInput.length!==6){setErr(t.invalidCode);return;}
    setLoading(true);
    const s=await loadSession(codeInput.toUpperCase());
    if(!s){setErr(t.invalidCode);setLoading(false);return;}
    setSession(s);setSessionCode(codeInput.toUpperCase());setView("chooseRole");setLoading(false);setErr("");
  };
  const doPickRole=async(tmId,role)=>{
    if(session.teams[tmId]?.players[role]){setErr(t.roleTaken);return;}
    const ns=JSON.parse(JSON.stringify(session));
    ns.teams[tmId].players[role]=name.trim();
    await saveSession(sessionCode,ns);
    setSession(ns);setMyTeam(tmId);setMyRole(role);setView("context");
  };
  const doStart=async()=>{const ns={...session,status:"playing"};await saveSession(sessionCode,ns);setSession(ns);setView("game");};
  const reset=()=>{setView("welcome");setSession(null);setSessionCode("");setIsFac(false);setMyRole("");setDebrief(null);setErr("");};

  const Header=()=>(<div style={G.hdr}>
    <div style={{display:"flex",alignItems:"center",gap:8}}>
      <span style={{fontSize:16}}>⚙</span>
      <span style={{fontWeight:700,fontSize:14}}>{t.title}</span>
      {sessionCode&&<span style={{fontSize:11,opacity:0.5,fontFamily:"monospace",marginLeft:4}}>{sessionCode}</span>}
    </div>
    <div style={G.row}>
      {session&&isFac&&<span style={{...G.tag("#F59E0B"),fontSize:11}}>{t.fac}</span>}
      {session&&!isFac&&myRole&&<span style={{...G.tag("#93C5FD"),fontSize:11}}>{t.roles[myRole]}</span>}
      {(view==="game"||view==="lobby")&&<button onClick={()=>setShowHelp(true)} style={{background:"rgba(255,255,255,0.15)",color:"#fff",border:"1px solid rgba(255,255,255,0.3)",borderRadius:"50%",width:26,height:26,cursor:"pointer",fontWeight:700,fontSize:13,padding:0}}>?</button>}
      <button onClick={()=>setLang(lang==="fr"?"en":"fr")} style={{background:"transparent",color:"#fff",border:"1px solid rgba(255,255,255,0.25)",borderRadius:4,padding:"3px 8px",cursor:"pointer",fontSize:11}}>{lang==="fr"?"EN":"FR"}</button>
      {view!=="welcome"&&view!=="landing"&&<button onClick={reset} style={{background:"transparent",color:"rgba(255,255,255,0.4)",border:"none",cursor:"pointer",fontSize:13}}>✕</button>}
    </div>
  </div>);

  if(view==="welcome")return <WelcomeScreen t={t} onStart={()=>setView("landing")}/>;

  if(view==="landing")return(<div style={G.bg}><Header/>
    <div style={G.center}>
      <div><div style={{fontSize:32,marginBottom:4}}>⚙</div><h1 style={{margin:"0 0 4px",color:"#1B3A4B",fontSize:24,fontWeight:800}}>{t.title}</h1><p style={{margin:0,color:"#64748B",fontSize:13}}>{t.sub}</p></div>
      <div style={{...G.card,width:"100%",maxWidth:380}}>
        <div style={{marginBottom:14}}><label style={{fontSize:12,fontWeight:600,color:"#64748B",display:"block",marginBottom:4}}>{t.yourName}</label><input style={G.inp} value={name} onChange={e=>setName(e.target.value)} placeholder={t.yourName} autoFocus onKeyDown={e=>e.key==="Enter"&&(tab==="create"?doCreate():doJoin())}/></div>
        <div style={{display:"flex",borderRadius:8,overflow:"hidden",border:"1.5px solid #D9D4C8",marginBottom:14}}>
          {["create","join"].map((tb,i)=>(<button key={tb} onClick={()=>{setTab(tb);setErr("");}} style={{flex:1,padding:"8px",border:"none",cursor:"pointer",fontWeight:600,fontSize:13,background:tab===tb?"#1B3A4B":"#FAFAF8",color:tab===tb?"#fff":"#64748B"}}>{i===0?t.create:t.join}</button>))}
        </div>
        {tab==="create"&&(<div style={{marginBottom:14}}><label style={{fontSize:12,fontWeight:600,color:"#64748B",display:"block",marginBottom:4}}>{t.numTeams}</label><div style={{display:"flex",gap:6}}>{[1,2,3].map(n=><button key={n} onClick={()=>setNumTeams(n)} style={{flex:1,padding:"8px",border:`2px solid ${numTeams===n?"#1B3A4B":"#D9D4C8"}`,borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:15,background:numTeams===n?"#1B3A4B":"#fff",color:numTeams===n?"#fff":"#64748B"}}>{n}</button>)}</div></div>)}
        {tab==="join"&&(<div style={{marginBottom:14}}><label style={{fontSize:12,fontWeight:600,color:"#64748B",display:"block",marginBottom:4}}>{t.code} <span style={{fontWeight:400,opacity:0.6}}>{t.codeHint}</span></label><input style={{...G.inp,fontFamily:"'Courier New',monospace",textAlign:"center",fontSize:22,letterSpacing:8}} value={codeInput} onChange={e=>setCodeInput(e.target.value.toUpperCase())} placeholder="· · · · · ·" maxLength={6} onKeyDown={e=>e.key==="Enter"&&doJoin()}/></div>)}
        {err&&<div style={{color:"#D4500A",fontSize:12,marginBottom:8,textAlign:"center"}}>{err}</div>}
        <button style={{...G.btn(tab==="create"?"#1B3A4B":"#D4500A"),width:"100%",padding:"11px",fontSize:14}} onClick={tab==="create"?doCreate:doJoin} disabled={loading}>{loading?"…":(tab==="create"?t.createBtn:t.joinBtn)}</button>
      </div>
    </div>
  </div>);

  if(view==="chooseRole"&&session)return(<div style={G.bg}><Header/>
    <div style={{padding:"20px 16px",maxWidth:580,margin:"0 auto"}}>
      <h3 style={{color:"#1B3A4B",marginBottom:16,fontSize:16}}>{t.chooseRole}</h3>
      {Object.keys(session.teams).map(tk=>{const tm=session.teams[tk];return(<div key={tk} style={{...G.card,marginBottom:12}}>
        <div style={{fontWeight:700,marginBottom:10}}>{tm.name}</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {ROLES.map(role=>{const taken=!!tm.players[role],isB=role==="wc-b";return(
            <button key={role} disabled={taken} style={{background:taken?"#F8FAFC":isB?"#FFFBEB":"#FAFAF8",border:`2px solid ${taken?"#F1F5F9":isB?"#D4500A":"#D9D4C8"}`,borderRadius:8,padding:"10px",cursor:taken?"default":"pointer",textAlign:"left",opacity:taken?0.5:1}} onClick={()=>!taken&&doPickRole(tk,role)}>
              <div style={{fontWeight:700,fontSize:13,color:taken?"#CBD5E1":isB?"#D4500A":"#1B3A4B",display:"flex",alignItems:"center",gap:4}}>{taken?"✓ ":""}{t.roles[role]}{isB&&!taken&&<span style={{fontSize:9,background:"#D4500A",color:"#fff",padding:"1px 4px",borderRadius:3}}>{t.goulot}</span>}</div>
              {taken?<div style={{fontSize:11,color:"#CBD5E1"}}>{tm.players[role]}</div>:<div style={{fontSize:11,color:"#94A3B8",marginTop:2}}>{t.rdesc[role]}</div>}
            </button>);
          })}
        </div>
      </div>);})}
      {err&&<div style={{color:"#D4500A",fontSize:12}}>{err}</div>}
    </div>
  </div>);

  if(view==="context")return(<div style={G.bg}><Header/><ContextScreen t={t} role={myRole} onReady={()=>{if(isFac)setView("lobby");else if(session?.status==="playing")setView("game");else setView("lobby");}}/></div>);

  if(view==="lobby"&&session)return(<div style={G.bg}><Header/>
    <div style={{padding:"20px 16px",maxWidth:540,margin:"0 auto"}}>
      <div style={{...G.card,marginBottom:16,textAlign:"center"}}>
        <div style={{fontSize:11,color:"#64748B",marginBottom:6,fontWeight:600,letterSpacing:1,textTransform:"uppercase"}}>{t.shareCode}</div>
        <div style={{fontFamily:"'Courier New',monospace",fontSize:44,fontWeight:700,color:"#1B3A4B",letterSpacing:14,padding:"4px 0"}}>{sessionCode}</div>
      </div>
      {Object.values(session.teams).map(tm=>(<div key={tm.id} style={{...G.card,marginBottom:12}}>
        <div style={{fontWeight:700,marginBottom:8}}>{tm.name}</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
          {ROLES.map(role=>{const pl=tm.players[role],auto=isAuto(tm,role);return(
            <div key={role} style={{background:pl?"#DCFCE7":auto?"#FEF3C7":"#F8FAFC",border:`1px solid ${pl?"#2D7D5244":auto?"#F59E0B44":"#E2E8F0"}`,borderRadius:6,padding:"4px 10px",fontSize:12}}>
              <span style={{color:"#64748B"}}>{t.roles[role]}: </span>
              <span style={{fontWeight:600,color:pl?"#2D7D52":auto?"#D4500A":"#CBD5E1"}}>{pl||auto?"🤖":"—"}</span>
            </div>);
          })}
        </div>
        {ROLES.filter(r=>isAuto(tm,r)).length>0&&(<div style={{marginTop:8,padding:"4px 8px",background:"#FFFBEB",borderRadius:6,fontSize:11,color:"#D4500A"}}>🤖 {t.autoPilotNote} : {ROLES.filter(r=>isAuto(tm,r)).map(r=>t.roles[r]).join(", ")}</div>)}
      </div>))}
      {isFac&&<button style={{...G.btn("#2D7D52"),width:"100%",padding:"13px",fontSize:15}} onClick={doStart}>▶ {t.start}</button>}
      {!isFac&&<div style={{textAlign:"center",color:"#64748B",fontSize:13,padding:12}}>{t.waitStart}</div>}
    </div>
  </div>);

  if(view==="game"&&session){
    const team=session.teams[myTeam];
    return(<div style={G.bg}><Header/>
      {showHelp&&(<div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.5)",zIndex:1000,overflowY:"auto"}}><div style={{maxWidth:600,margin:"40px auto",padding:"0 16px 40px"}}><ContextScreen t={t} role={myRole} onReady={()=>setShowHelp(false)}/></div></div>)}
      {isFac?<FacilitatorView session={session} onUpdate={setSession} t={t} onDebrief={r=>{setDebrief(r);setView("debrief");}}/>:team?<PlayerView session={session} team={team} role={myRole} t={t} onUpdate={setSession}/>:<div style={G.center}>{t.waitStart}</div>}
    </div>);
  }

  if(view==="debrief"){
    const res=debrief||session?.results||{};
    return(<div style={G.bg}><Header/><DebriefScreen results={res} t={t} onNew={reset}/></div>);
  }

  return <div style={G.bg}><Header/><div style={G.center}>…</div></div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
