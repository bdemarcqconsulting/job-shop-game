function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function mkDeck(copies){const cards=[1,2,3,4].flatMap(p=>Array.from({length:copies},(_,i)=>({id:`P${p}-${i+1}`,product:p,copy:i+1,routing:[...ROUTINGS[p]],ops:ROUTINGS[p].map(wc=>({wc,dayComplete:null,done:false})),currentOpIdx:-1,releaseDay:null,completedDay:null,flowDays:null})));return shuffle(cards).map((c,i)=>({...c,fifoNum:i+1}));}
function mkTeam(id,name,copies){return{id,name,players:{},deck:mkDeck(copies),queues:{A:[],B:[],C:[],D:[]},completed:[],bufferB:0,bufferLimit:null};}
function calcBufB(team){return WCS.reduce((sum,wc)=>sum+(team.queues[wc]||[]).reduce((n,card)=>{let b=0;for(let i=card.currentOpIdx;i<card.routing.length;i++)if(card.routing[i]==="B")b++;return n+b;},0),0);}
function countBatWC(team,wc){return(team.queues[wc]||[]).reduce((n,card)=>{let b=0;for(let i=card.currentOpIdx;i<card.routing.length;i++)if(card.routing[i]==="B")b++;return n+b;},0);}

function applyDay(team,day,scenario,actions){
  const t=JSON.parse(JSON.stringify(team));
  const snapshot={A:[...t.queues.A],B:[...t.queues.B],C:[...t.queues.C],D:[...t.queues.D]};
  const newQueues={A:[],B:[],C:[],D:[]};const newCompleted=[...t.completed];
  WCS.forEach(wc=>{
    const role=`wc-${wc.toLowerCase()}`;const act=actions[role];const q=[...snapshot[wc]];
    if(q.length===0||act==='pass'){q.forEach(c=>newQueues[wc].push(c));return;}
    let processIdx=0;
    if(act&&act!=='pass'&&act!=='process'){const found=q.findIndex(c=>c.id===act);if(found>=0)processIdx=found;}
    q.forEach((card,i)=>{
      if(i===processIdx){
        const c=JSON.parse(JSON.stringify(card));c.ops[c.currentOpIdx].dayComplete=day;c.ops[c.currentOpIdx].done=true;c.currentOpIdx++;
        if(c.currentOpIdx>=c.routing.length){c.completedDay=day;c.flowDays=day-c.releaseDay;newCompleted.push(c);}
        else newQueues[c.routing[c.currentOpIdx]].push(c);
      }else newQueues[wc].push(card);
    });
  });
  t.queues=newQueues;t.completed=newCompleted;
  const sa=actions['scheduler'];
  if(t.deck.length>0){
    let toRelease=null;
    if(sa&&sa.startsWith('release:')){const idx=t.deck.findIndex(c=>c.id===sa.slice(8));if(idx>=0)[toRelease]=t.deck.splice(idx,1);else toRelease=t.deck.shift();}
    else if(sa==='release')toRelease=t.deck.shift();
    if(toRelease){toRelease.releaseDay=day;toRelease.currentOpIdx=0;t.queues[toRelease.routing[0]].push(toRelease);}
  }
  t.bufferB=calcBufB(t);return t;
}

function computeStats(cards){const f=cards.map(c=>c.flowDays).filter(v=>v!=null).sort((a,b)=>a-b);if(!f.length)return null;const avg=f.reduce((a,b)=>a+b,0)/f.length;const med=f.length%2===0?(f[f.length/2-1]+f[f.length/2])/2:f[Math.floor(f.length/2)];return{min:f[0],max:f[f.length-1],avg:+(avg.toFixed(1)),stddev:+(Math.sqrt(f.reduce((a,v)=>a+Math.pow(v-avg,2),0)/f.length).toFixed(1)),median:med,count:f.length};}
function genCode(){const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";return Array.from({length:6},()=>c[0|Math.random()*c.length]).join("");}
function isAuto(team,role){return AUTO_ORDER.includes(role)&&!team.players[role];}
function getHumanRoles(team){return ROLES.filter(r=>r!=="monitor"&&!isAuto(team,r));}

async function saveSession(code,state){await db.ref(`sessions/jsg-${code}`).set({json:JSON.stringify(state)});}
async function loadSession(code){const snap=await db.ref(`sessions/jsg-${code}`).get();if(!snap.exists())return null;return JSON.parse(snap.val().json);}
async function saveAction(code,scn,team,role,day,action){await db.ref(`actions/jsg-${code}-s${scn}-${team}-${role}-${day}`).set({json:JSON.stringify({action,ts:Date.now()})});}
async function loadAllActions(code,scn,teamId,day){const acts={};for(const role of ROLES){const snap=await db.ref(`actions/jsg-${code}-s${scn}-${teamId}-${role}-${day}`).get();if(snap.exists())acts[role]=JSON.parse(snap.val().json).action;}return acts;}
async function isEmailAuthorized(email){try{const snap=await db.ref('admin/whitelist').get();if(!snap.exists())return false;const val=snap.val();const norm=email.toLowerCase().trim();return Object.values(val).some(v=>typeof v==="string"&&v.toLowerCase().trim()===norm);}catch(e){return false;}}
async function getSavedEmail(){try{const s=await db.ref('admin/last_fac_email').get();return s.exists()?s.val():'';}catch(e){return '';}}
async function saveEmailDB(email){try{await db.ref('admin/last_fac_email').set(email);}catch(e){}}

    <table style={{width:"100%",borderCollapse:"collapse",marginBottom:3}}><thead><tr><td style={{fontSize:9,color:"#94A3B8",paddingBottom:1,fontWeight:600}}>Op.</td><td style={{fontSize:9,color:"#94A3B8",textAlign:"right",paddingBottom:1,fontWeight:600}}>Jour ✓</td></tr></thead>
      <tbody>{card.routing.map((wc,i)=>(<tr key={i} style={{background:i===card.currentOpIdx?"#FEF3C7":card.ops[i].done?"#F0FDF4":"transparent"}}><td style={{fontWeight:700,fontSize:13,color:wc==="B"?"#D4500A":"#1B3A4B",padding:"2px 0",lineHeight:1}}>{wc}</td><td style={{textAlign:"right",fontFamily:"monospace",fontSize:11,fontWeight:card.ops[i].done?700:400,color:card.ops[i].done?"#2D7D52":"#E2E8F0",padding:"2px 0"}}>{card.ops[i].done?card.ops[i].dayComplete:<span style={{color:"#E2E8F0"}}>___</span>}</td></tr>))}</tbody>

function BufferWindow({team,t,bufferLimit}){
  const total=calcBufB(team);const limit=bufferLimit||5;const pct=Math.min(total/limit,1);const color=pct>=1?"#D4500A":pct>=0.7?"#F59E0B":"#2D7D52";
  return(<div style={{...G.card,marginBottom:8,background:"#FFFBEB",border:`2px solid ${color}`}}>
    <div style={{fontWeight:700,fontSize:13,color:"#1B3A4B",marginBottom:8}}>{t.bufferWindow}</div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:8}}>{WCS.map(wc=>{const n=countBatWC(team,wc);return(<div key={wc} style={{display:"flex",justifyContent:"space-between",padding:"4px 8px",background:"#fff",borderRadius:6,border:"1px solid #E2E8F0"}}><span style={{fontSize:12,fontWeight:wc==="B"?700:400,color:wc==="B"?"#D4500A":"#64748B"}}>WC-{wc}{wc==="B"&&" ⭐"}</span><span style={{fontFamily:"monospace",fontWeight:700,fontSize:13,color:n>0?"#D4500A":"#94A3B8"}}>{n}</span></div>);})}</div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}><span style={{fontSize:13,fontWeight:700,color:"#1B3A4B"}}>{t.totalShop} : <span style={{color}}>{total}</span> / {limit}</span></div>
    <div style={{height:10,background:"#E2E8F0",borderRadius:5,overflow:"hidden"}}><div style={{height:"100%",width:`${pct*100}%`,background:color,borderRadius:5,transition:"width 0.3s"}}/></div>
    <div style={{marginTop:5,fontSize:12,color,fontWeight:600}}>{total<limit?`🟢 ${t.bufOk}`:`🔴 ${t.bufFull}`}</div>
  </div>);
}

  const wip=WCS.reduce((n,wc)=>n+(team.queues[wc]?.length||0),0);
  return(<div style={{...G.card,marginBottom:8}}>
    <div style={{fontWeight:700,fontSize:13,color:"#1B3A4B",marginBottom:8,display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:4}}>
      <span>{t.teamDashboard} — {team.name}</span>
      <div style={G.row}><span style={{fontSize:11,color:"#64748B"}}>{t.wip}: <b>{wip}</b></span><span style={{fontSize:11,color:"#64748B"}}>{t.deck}: <b>{team.deck.length}</b></span><span style={{fontSize:11,color:"#2D7D52",fontWeight:600}}>✓ {team.completed.length}</span><span style={{fontSize:11,color:(team.bufferB||0)>=(team.bufferLimit||5)?"#D4500A":"#64748B"}}>{t.buf}: {team.bufferB||0}/{team.bufferLimit||5}</span></div>
    </div>

function FacilitatorView({session,onUpdate,t,onDebrief}){
  const [actStatus,setActStatus]=useState({});const [loading,setLoading]=useState(false);const [showCharts,setShowCharts]=useState(false);
  const teams=Object.values(session.teams||{});
  useEffect(()=>{
    if(session.dayPhase!=="open")return;
    const iv=setInterval(async()=>{
      const st={};for(const tm of teams)st[tm.id]=await loadAllActions(session.code,session.scenario,tm.id,session.day);setActStatus(st);
      const humanRoles=teams.flatMap(tm=>getHumanRoles(tm));const gotActs=teams.reduce((n,tm)=>n+Object.keys(st[tm.id]||{}).filter(r=>r!=="monitor"&&!isAuto(tm,r)).length,0);
      if(gotActs>=humanRoles.length&&humanRoles.length>0)doCloseDay(st);
    },2500);
    return()=>clearInterval(iv);
  },[session.dayPhase,session.day]);
  const doCloseDay=async(acts)=>{
    if(loading)return;setLoading(true);
    const updTeams={...session.teams};
    for(const tm of teams){const a=acts||await loadAllActions(session.code,session.scenario,tm.id,session.day);updTeams[tm.id]=applyDay(tm,session.day,session.scenario,a);}
    const allDone=Object.values(updTeams).every(tm=>tm.deck.length===0&&WCS.every(wc=>tm.queues[wc].length===0));
    const ns={...session,teams:updTeams,dayPhase:allDone?"scnEnd":"idle"};
    await saveSession(session.code,ns);onUpdate(ns);setLoading(false);
  };
  const openDay=async()=>{const ns={...session,dayPhase:"open",day:session.day+1};setActStatus({});await saveSession(session.code,ns);onUpdate(ns);};
  const startScenario=async(scnNum)=>{
    const copies=session.cardCopies||5;const newTeams={};
    let s1Deck=null;if(scnNum===3&&session.results&&session.results[1]&&session.results[1].deck)s1Deck=session.results[1].deck;
    Object.values(session.teams).forEach(tm=>{const deck=s1Deck?JSON.parse(JSON.stringify(s1Deck)):mkDeck(copies);newTeams[tm.id]={...tm,deck,queues:{A:[],B:[],C:[],D:[]},completed:[],bufferB:0,bufferLimit:scnNum===3?null:tm.bufferLimit};});
    const ns={...session,scenario:scnNum,day:0,dayPhase:"idle",status:"playing",teams:newTeams};await saveSession(session.code,ns);onUpdate(ns);
  };
  const goNext=async()=>{
    const res={...session.results};
    res[session.scenario]={completed:Object.values(session.teams).flatMap(tm=>tm.completed.map(c=>({...c,teamId:tm.id}))),deck:session.scenario===1?JSON.parse(JSON.stringify(Object.values(session.teams)[0]?.deck||[])):undefined};
    const ns={...session,results:res,dayPhase:"idle"};await saveSession(session.code,ns);
    if(Object.values(res).filter(Boolean).length>=3){onDebrief(res);return;}onUpdate(ns);
  };
  const played=session.results?Object.keys(session.results).filter(k=>session.results[k]!=null).map(Number):[];
  const isScnEnd=session.dayPhase==="scnEnd";
  const humanRoles=teams.flatMap(tm=>getHumanRoles(tm));
  const gotActs=teams.reduce((n,tm)=>n+Object.keys(actStatus[tm.id]||{}).filter(r=>r!=="monitor"&&!isAuto(tm,r)).length,0);
  const allIn=gotActs>=humanRoles.length&&humanRoles.length>0;
  return(<div style={{padding:16}}>
    {showCharts&&<LiveChartsModal session={session} t={t} onClose={()=>setShowCharts(false)}/>}
    <div style={{...G.card,marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <div style={G.row}>
          {[1,2,3].map(s=>{const active=session.scenario===s&&session.status==="playing";const done=played.includes(s);return(<button key={s} style={{...G.btn(active?SC[s-1]:done?"#94A3B8":"#1B3A4B"),fontSize:12,padding:"7px 14px"}} onClick={()=>startScenario(s)}>{done&&!active?"✓ ":""}{t.startScn} S{s} — {t.scnNames[s]}</button>);})}
          <button style={{...G.btn("#64748B"),fontSize:12,padding:"7px 14px"}} onClick={()=>setShowCharts(true)}>{t.liveCharts}</button>
          {played.length>0&&<button style={{...G.ghost,fontSize:12,padding:"7px 14px"}} onClick={()=>onDebrief(session.results)}>📊 {t.viewDeb}</button>}
        </div>
        {session.scenario&&session.status==="playing"&&(<div style={G.row}><span style={{...G.tag(SC[session.scenario-1]),fontSize:12}}>{t.scnNames[session.scenario]}</span><span style={{fontWeight:700,fontSize:16,color:"#1B3A4B"}}>{t.day} {session.day}</span>{session.dayPhase==="open"&&<span style={{...G.tag("#2D7D52"),fontSize:11}}>● ouvert</span>}{isScnEnd&&<span style={{...G.tag("#D4500A"),fontSize:11}}>{t.scnDone}</span>}</div>)}
      </div>
    </div>
    {session.status==="playing"&&(<div style={{...G.card,marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
      <div style={G.row}>
        {session.dayPhase==="idle"&&!isScnEnd&&<button style={G.btn("#2D7D52")} onClick={openDay}>▶ {t.day} {session.day+1}</button>}
        {session.dayPhase==="open"&&(<><span style={{fontSize:12,color:allIn?"#2D7D52":"#64748B"}}>{allIn?`✓ ${t.actsIn}`:`${humanRoles.length-gotActs} ${t.actsPend}`}</span><button style={G.btn("#D4500A")} onClick={()=>doCloseDay(null)} disabled={loading}>{loading?"…":t.forceClose}</button></>)}

function App(){
  const [lang,setLang]=useState("fr");const t=I18N[lang];
  const [facMode,setFacMode]=useState(false);const [facEmail,setFacEmail]=useState("");
  const [name,setName]=useState("");const [codeInput,setCodeInput]=useState("");
  const [err,setErr]=useState("");const [sessionCode,setSessionCode]=useState("");
  const [isFac,setIsFac]=useState(false);const [myTeam,setMyTeam]=useState("team1");const [myRole,setMyRole]=useState("");
  const [session,setSession]=useState(null);const [debrief,setDebrief]=useState(null);const [view,setView]=useState("welcome");
  const [loading,setLoading]=useState(false);const [numTeams,setNumTeams]=useState(1);const [numCards,setNumCards]=useState(20);
  const [showHelp,setShowHelp]=useState(false);const [showCharts,setShowCharts]=useState(false);const [showAccessReq,setShowAccessReq]=useState(false);

  useEffect(()=>{getSavedEmail().then(e=>{if(e)setFacEmail(e);});},[]);

  const doCreate=async()=>{
    if(!facEmail.trim()){setErr("Entrez votre email animateur");return;}if(!name.trim()){setErr(t.enterName);return;}setLoading(true);
    const auth=await isEmailAuthorized(facEmail.trim());if(!auth){setLoading(false);setShowAccessReq(true);return;}
    await saveEmailDB(facEmail.trim());const code=genCode();const copies=numCards/4;const teams={};
    for(let i=1;i<=numTeams;i++)teams[`team${i}`]=mkTeam(`team${i}`,`${t.team} ${i}`,copies);
    const ns={code,facilitatorName:name.trim(),facilitatorEmail:facEmail.trim(),scenario:null,day:0,dayPhase:"idle",status:"setup",teams,results:{1:null,2:null,3:null},lang,cardCopies:copies};
    await saveSession(code,ns);setSession(ns);setSessionCode(code);setIsFac(true);setView("context");setLoading(false);
  };
  const doJoin=async()=>{
    if(!name.trim()){setErr(t.enterName);return;}if(codeInput.length!==6){setErr(t.invalidCode);return;}setLoading(true);
    const s=await loadSession(codeInput.toUpperCase());if(!s){setErr(t.invalidCode);setLoading(false);return;}
    setSession(s);setSessionCode(codeInput.toUpperCase());setView("chooseRole");setLoading(false);setErr("");
  };
  const doPickRole=async(tmId,role)=>{
    setLoading(true);
    const fresh=await loadSession(sessionCode);
    if(!fresh){setErr(t.invalidCode);setLoading(false);return;}
    if(fresh.teams[tmId]?.players[role]){setErr(t.roleTaken);setSession(fresh);setLoading(false);return;}
    const ns=JSON.parse(JSON.stringify(fresh));ns.teams[tmId].players[role]=name.trim();
    await saveSession(sessionCode,ns);setSession(ns);setMyTeam(tmId);setMyRole(role);setView("context");setLoading(false);
  };
  const doStart=async()=>{
    const fresh=await loadSession(sessionCode);
    const base=fresh||session;
    const ns={...base,status:"setup"};
    await saveSession(sessionCode,ns);setSession(ns);setView("game");
  };
  const reset=()=>{setView("welcome");setSession(null);setSessionCode("");setIsFac(false);setMyRole("");setDebrief(null);setErr("");setShowCharts(false);};
  const roleLabel=(role,n)=>n?`${t.roles[role]} — ${n}`:t.roles[role];

  const AccessReqModal=()=>(<div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.6)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}><div style={{background:"#fff",borderRadius:12,padding:24,maxWidth:420,width:"100%"}}><div style={{fontSize:24,marginBottom:4,textAlign:"center"}}>🔒</div><h3 style={{margin:"0 0 8px",color:"#1B3A4B",textAlign:"center"}}>Accès non autorisé</h3><p style={{fontSize:13,color:"#64748B",textAlign:"center",marginBottom:16}}>L'adresse <b>{facEmail}</b> n'est pas dans la liste des animateurs autorisés.</p><a href={`mailto:${ADMIN_EMAIL}?subject=Demande%20accès%20Job%20Shop%20Game&body=Bonjour%2C%0A%0AJe%20souhaite%20obtenir%20l'accès%20animateur%20au%20Job%20Shop%20Game.%0A%0AEmail%20à%20autoriser%20%3A%20${encodeURIComponent(facEmail)}%0A%0AMerci.`} style={{display:"block",textAlign:"center",background:"#1B3A4B",color:"#fff",padding:"10px 20px",borderRadius:8,textDecoration:"none",fontWeight:600,fontSize:14,marginBottom:10}}>✉️ Demander l'accès</a><button style={{...G.ghost,width:"100%"}} onClick={()=>setShowAccessReq(false)}>Fermer</button></div></div>);

  const Header=()=>(<div style={G.hdr}>
    <div style={{display:"flex",alignItems:"center",gap:8}}><span>⚙</span><span style={{fontWeight:700,fontSize:14}}>{t.title}</span>{sessionCode&&<span style={{fontSize:11,opacity:0.5,fontFamily:"monospace",marginLeft:4}}>{sessionCode}</span>}</div>
    <div style={G.row}>
      {session&&isFac&&<span style={{...G.tag("#F59E0B"),fontSize:11}}>{t.fac} — {name}</span>}
      {session&&!isFac&&myRole&&<span style={{...G.tag("#93C5FD"),fontSize:11}}>{roleLabel(myRole,name)}</span>}
      {view==="game"&&session&&!isFac&&<button onClick={()=>setShowCharts(true)} style={{background:"rgba(255,255,255,0.15)",color:"#fff",border:"1px solid rgba(255,255,255,0.3)",borderRadius:4,padding:"3px 8px",cursor:"pointer",fontSize:11}}>📊</button>}
      {view==="game"&&<button onClick={()=>setShowHelp(true)} style={{background:"rgba(255,255,255,0.15)",color:"#fff",border:"1px solid rgba(255,255,255,0.3)",borderRadius:"50%",width:26,height:26,cursor:"pointer",fontWeight:700,fontSize:12,padding:0}}>?</button>}
      <button onClick={()=>setLang(lang==="fr"?"en":"fr")} style={{background:"transparent",color:"#fff",border:"1px solid rgba(255,255,255,0.25)",borderRadius:4,padding:"3px 8px",cursor:"pointer",fontSize:11}}>{lang==="fr"?"EN":"FR"}</button>
      {view!=="welcome"&&view!=="landing"&&<button onClick={reset} style={{background:"transparent",color:"rgba(255,255,255,0.4)",border:"none",cursor:"pointer",fontSize:13}}>✕</button>}
    </div>
  </div>);

  if(view==="welcome")return <WelcomeScreen t={t} onStart={()=>setView("landing")}/>;
  if(view==="landing")return(<div style={G.bg}>{showAccessReq&&<AccessReqModal/>}<Header/><div style={G.center}>
    <div><div style={{fontSize:28,marginBottom:4}}>⚙</div><h1 style={{margin:"0 0 4px",color:"#1B3A4B",fontSize:22,fontWeight:800}}>{t.title}</h1><p style={{margin:0,color:"#64748B",fontSize:13}}>{t.sub}</p></div>
    <div style={{...G.card,width:"100%",maxWidth:380}}>
      {!facMode?(<div>
        <div style={{marginBottom:14}}><label style={{fontSize:12,fontWeight:600,color:"#64748B",display:"block",marginBottom:4}}>{t.yourName}</label><input style={G.inp} value={name} onChange={e=>setName(e.target.value)} placeholder={t.yourName} autoFocus onKeyDown={e=>e.key==="Enter"&&doJoin()}/></div>

        {err&&<div style={{color:"#D4500A",fontSize:12,marginBottom:8,textAlign:"center"}}>{err}</div>}
        <button style={{...G.btn("#D4500A"),width:"100%",padding:"11px",fontSize:14}} onClick={doJoin} disabled={loading}>{loading?"…":t.joinBtn}</button>
        <div style={{textAlign:"center",marginTop:14}}><button onClick={()=>{setFacMode(true);setErr("");}} style={{background:"none",border:"none",color:"#94A3B8",fontSize:12,cursor:"pointer",textDecoration:"underline"}}>Accès animateur →</button></div>
      </div>):(<div>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}><button onClick={()=>{setFacMode(false);setErr("");}} style={{background:"none",border:"none",color:"#64748B",cursor:"pointer",fontSize:18,padding:0}}>←</button><span style={{fontWeight:700,color:"#1B3A4B",fontSize:14}}>Espace animateur</span></div>
        <div style={{marginBottom:12}}><label style={{fontSize:12,fontWeight:600,color:"#64748B",display:"block",marginBottom:4}}>Email animateur</label><input style={G.inp} type="email" value={facEmail} onChange={e=>setFacEmail(e.target.value)} placeholder="votre@email.com"/></div>
        <div style={{marginBottom:12}}><label style={{fontSize:12,fontWeight:600,color:"#64748B",display:"block",marginBottom:4}}>{t.yourName}</label><input style={G.inp} value={name} onChange={e=>setName(e.target.value)} placeholder={t.yourName}/></div>
        <div style={{marginBottom:10}}><label style={{fontSize:12,fontWeight:600,color:"#64748B",display:"block",marginBottom:4}}>{t.numTeams}</label><div style={{display:"flex",gap:6}}>{[1,2,3].map(n=><button key={n} onClick={()=>setNumTeams(n)} style={{flex:1,padding:"8px",border:`2px solid ${numTeams===n?"#1B3A4B":"#D9D4C8"}`,borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:15,background:numTeams===n?"#1B3A4B":"#fff",color:numTeams===n?"#fff":"#64748B"}}>{n}</button>)}</div></div>
        <div style={{marginBottom:14}}><label style={{fontSize:12,fontWeight:600,color:"#64748B",display:"block",marginBottom:4}}>{t.numCards}</label><div style={{display:"flex",gap:6}}>{[20,32,40].map(n=><button key={n} onClick={()=>setNumCards(n)} style={{flex:1,padding:"8px",border:`2px solid ${numCards===n?"#1B3A4B":"#D9D4C8"}`,borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:13,background:numCards===n?"#1B3A4B":"#fff",color:numCards===n?"#fff":"#64748B"}}>{n}</button>)}</div></div>
        {err&&<div style={{color:"#D4500A",fontSize:12,marginBottom:8,textAlign:"center"}}>{err}</div>}
        <button style={{...G.btn("#1B3A4B"),width:"100%",padding:"11px",fontSize:14}} onClick={doCreate} disabled={loading}>{loading?"…":t.createBtn}</button>
      </div>)}
    </div>
  </div></div>);

  if(view==="chooseRole"&&session)return(<div style={G.bg}><Header/><div style={{padding:"20px 16px",maxWidth:580,margin:"0 auto"}}>
    <h3 style={{color:"#1B3A4B",marginBottom:16,fontSize:16}}>{t.chooseRole}</h3>
    {Object.keys(session.teams).map(tk=>{const tm=session.teams[tk];return(<div key={tk} style={{...G.card,marginBottom:12}}><div style={{fontWeight:700,marginBottom:10}}>{tm.name}</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>{ROLES.map(role=>{const taken=!!tm.players[role],isB=role==="wc-b";return(<button key={role} disabled={taken} style={{background:taken?"#F8FAFC":isB?"#FFFBEB":"#FAFAF8",border:`2px solid ${taken?"#F1F5F9":isB?"#D4500A":"#D9D4C8"}`,borderRadius:8,padding:"10px",cursor:taken?"default":"pointer",textAlign:"left",opacity:taken?0.5:1}} onClick={()=>!taken&&doPickRole(tk,role)}><div style={{fontWeight:700,fontSize:13,color:taken?"#CBD5E1":isB?"#D4500A":"#1B3A4B",display:"flex",alignItems:"center",gap:4}}>{taken?"✓ ":""}{t.roles[role]}{isB&&!taken&&<span style={{fontSize:9,background:"#D4500A",color:"#fff",padding:"1px 4px",borderRadius:3}}>{t.goulot}</span>}</div>{taken?<div style={{fontSize:11,color:"#2D7D52",fontWeight:600}}>{tm.players[role]}</div>:<div style={{fontSize:11,color:"#94A3B8",marginTop:2}}>{t.rdesc[role]}</div>}</button>);})}</div></div>);})}
    {err&&<div style={{color:"#D4500A",fontSize:12}}>{err}</div>}
  </div></div>);

  if(view==="context")return(<div style={G.bg}><Header/><ContextScreen t={t} role={myRole} onReady={()=>{if(isFac)setView("lobby");else if(session?.status==="playing")setView("game");else setView("lobby");}}/></div>);

  if(view==="lobby"&&session){
    function LobbyPoller(){useEffect(()=>{const iv=setInterval(async()=>{const ns=await loadSession(sessionCode);if(!ns)return;setSession(ns);if(!isFac&&ns.status==="playing"&&ns.scenario)setView("game");},2500);return()=>clearInterval(iv);},[]);return null;}
    return(<div style={G.bg}><Header/><LobbyPoller/><div style={{padding:"20px 16px",maxWidth:540,margin:"0 auto"}}>
      <div style={{...G.card,marginBottom:16,textAlign:"center"}}><div style={{fontSize:11,color:"#64748B",marginBottom:6,fontWeight:600,letterSpacing:1,textTransform:"uppercase"}}>{t.shareCode}</div><div style={{fontFamily:"'Courier New',monospace",fontSize:44,fontWeight:700,color:"#1B3A4B",letterSpacing:14,padding:"4px 0"}}>{sessionCode}</div></div>
      {Object.values(session.teams).map(tm=>(<div key={tm.id} style={{...G.card,marginBottom:12}}><div style={{fontWeight:700,marginBottom:8}}>{tm.name}</div><div style={{display:"flex",flexWrap:"wrap",gap:6}}>{ROLES.map(role=>{const pl=tm.players[role],auto=isAuto(tm,role);return(<div key={role} style={{background:pl?"#DCFCE7":auto?"#FEF3C7":"#F8FAFC",border:`1px solid ${pl?"#2D7D5244":auto?"#F59E0B44":"#E2E8F0"}`,borderRadius:6,padding:"4px 10px",fontSize:12}}><span style={{color:"#64748B"}}>{t.roles[role]}</span>{pl&&<span style={{fontWeight:700,color:"#2D7D52"}}> — {pl}</span>}{!pl&&auto&&<span style={{fontWeight:600,color:"#D4500A"}}> 🤖</span>}{!pl&&!auto&&<span style={{color:"#CBD5E1"}}> —</span>}</div>);})}</div></div>))}
      {isFac&&<button style={{...G.btn("#2D7D52"),width:"100%",padding:"13px",fontSize:15}} onClick={doStart}>▶ {t.start}</button>}
      {!isFac&&<div style={{textAlign:"center",color:"#64748B",fontSize:13,padding:12}}>⏳ {t.waitStart}</div>}
    </div></div>);
  }

  if(view==="game"&&session){
    const team=session.teams[myTeam];
    return(<div style={G.bg}><Header/>
      {showHelp&&(<div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.5)",zIndex:1000,overflowY:"auto"}}><div style={{maxWidth:600,margin:"40px auto",padding:"0 16px 40px"}}><ContextScreen t={t} role={myRole} onReady={()=>setShowHelp(false)}/></div></div>)}
      {showCharts&&<LiveChartsModal session={session} t={t} onClose={()=>setShowCharts(false)}/>}
      {isFac?<FacilitatorView session={session} onUpdate={setSession} t={t} onDebrief={r=>{setDebrief(r);setView("debrief");}}/>
        :!team?<div style={G.center}>{t.waitStart}</div>
        :myRole==="scheduler"?<SchedulerView session={session} team={team} t={t} onUpdate={setSession}/>
        :myRole==="monitor"?<MonitorView session={session} team={team} t={t} onUpdate={setSession}/>
        :<OperatorView session={session} team={team} role={myRole} t={t} onUpdate={setSession}/>
      }
    </div>);
  }

  if(view==="debrief"){const res=debrief||session?.results||{};return(<div style={G.bg}><Header/><DebriefScreen results={res} t={t} onNew={reset}/></div>);}
  return <div style={G.bg}><Header/><div style={G.center}>…</div></div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
